# improve.yaml — the improvement loop's declaration for a2uicatalog.
#
# Same split as project.yaml/ops.py: the ENGINE is generic and lives with the
# a2uicatalog-improve skill; THIS file is the project-specific declaration.
# Any repo with an improve.yaml can be driven by the same runner.
#
#   improve.py score      the benchmark
#   improve.py next       what to work on, and everything needed to start it
#   improve.py verify ID  the topic's own definition of done
#
# THE RULE THIS FILE EXISTS TO ENFORCE: a session is judged on the index delta
# it moved, not the work it appeared to do. Every dimension is a declared
# command that prints a float 0-1 on its last line. Nothing here is scored by
# judgement, because judgement is what drifts.

project: a2uicatalog

# ── the benchmark ─────────────────────────────────────────────────────────
# Weights say what this platform is FOR. Portability integrity is the heaviest
# because the moat is "one payload, many surfaces" — everything else is
# downstream of that claim being true.
dimensions:

  portability_integrity:
    weight: 25
    target: 0.98      # destination
    floor:  0.80      # regression alarm
    rationale: >
      Declarations honest. Not 1.0 — a few atoms are legitimately GAS-bound by Workspace auth.
    measures: >
      Share of atoms whose surface declaration is honest. An atom declaring
      GAS-only without a GAS dependency understates the moat; one declaring a
      surface it cannot serve oversells it. The second is worse.
    probe: python3 improve_probes/portability.py

  agent_reachability:
    weight: 20
    target: 1.00      # destination
    floor:  0.95      # regression alarm
    rationale: >
      The front door. Anything below full is a stranger hitting a wall.
    measures: >
      Can a zero-dependency stdlib client discover AND render? Probed over the
      network as a stranger's first script would. This is the dimension the
      Browser Integrity Check block destroyed silently on 2026-08-02 — every
      discovery document 403'd to Python's stdlib while curl worked.
    probe: python3 improve_probes/reachability.py

  host_coverage:
    weight: 15
    target: 0.70      # destination
    floor:  0.45      # regression alarm
    rationale: >
      Mean reach. Email and Chat will never carry canvas atoms; 0.70 is honest breadth, not universality.
    measures: >
      Mean share of published atoms each declared surface actually carries.
      Not "does a renderer exist" — that is trivially true and cannot move.
    probe: python3 improve_probes/host_coverage.py

  change_safety:
    weight: 15
    target: 1.00      # destination
    floor:  0.40      # regression alarm
    rationale: >
      Every deploy target gated. Each ungated one has already cost a day.
    measures: >
      Share of DEPLOY TARGETS covered by a gate that fails when they drift.
      2026-08-01 went to exactly this: a fix shipped, the thing serving it did
      not move, and nothing said so.
    probe: python3 improve_probes/change_safety.py

  developer_onramp:
    weight: 15
    target: 1.00      # destination
    floor:  0.60      # regression alarm
    rationale: >
      Contract to rendered surface in one step.
    measures: >
      Can a stranger go from the published contract to a rendered surface in
      one step? Scored on the openapi example being present AND executable.
    probe: python3 improve_probes/onramp.py

  publication_hygiene:
    weight: 10
    target: 1.00      # destination
    floor:  1.00      # regression alarm
    rationale: >
      Non-negotiable — floor equals target.
    measures: >
      Staging boundary held, trademarks disclaimed, private tier untracked.
    probe: python3 improve_probes/hygiene.py

# ── authorisation classes ─────────────────────────────────────────────────
# The whole point of the loop is that green work needs no conversation. These
# mirror CLAUDE.md's publication boundary rather than inventing a second one.
authorisation:
  green: >
    Proceed without asking. Code, tests, gates, generators, docs, local
    verification, and any change already covered by a declared ops process.
    Report what was done afterwards.
  amber: >
    Proceed, but lead the report with it. Schema changes, new dependencies,
    anything that alters a published artefact's content.
  red: >
    Never without an explicit ask. Money, destructive or irreversible actions,
    external accounts and dashboards, trademark/legal wording, publishing a NEW
    public artefact, and anything touching the private tier's secrets.

# ── stop conditions ───────────────────────────────────────────────────────
budget:
  max_topics_per_session: 2
  stop_when:
    - "the topic's verify command passes"
    - "two consecutive verification failures on the same topic — escalate, do not iterate a third time"
    - "the work would require an amber or red action that was not pre-authorised"
    - "the index moves DOWN — revert and report rather than continuing"

# ── the backlog ───────────────────────────────────────────────────────────
# impact 1-5, effort 1-5, confidence 0-1. Priority = impact x confidence / effort.
# `decided` exists to stop the loop re-litigating settled questions — the single
# biggest source of unnecessary input requests.
backlog:

  - id: tranche2-dynamic-atoms
    title: Promote the 43 dynamic atoms with an honest works_on/degraded_on call
    dimension: portability_integrity
    impact: 5
    effort: 3
    confidence: 0.9
    authorisation: amber
    why: >
      76 atoms are still GAS-only with no GAS dependency. They have Python web
      renderers already; each needs a per-atom judgement on whether web is
      full-fidelity (works_on) or reduced (degraded_on), which is why this is
      not a blanket flip.
    decided:
      - "Gitignored-but-untracked is deliberate; untracked-and-not-ignored is an accident."
      - "Never edit text_block's works_on — it DEFINES the &id006 anchor for 79 atoms."
      - "A renderer existing is not proof of fidelity; spot-render before promoting."
    done_when: portability_integrity probe exceeds 0.95
    verify: python3 improve_probes/portability.py

  - id: id006-anchor-relocation
    title: Move the &id006 GAS-only anchor off text_block
    dimension: portability_integrity
    impact: 3
    effort: 2
    confidence: 0.95
    authorisation: amber
    why: >
      A plain paragraph atom defines the "GAS-only" default that 79 other atoms
      inherit by alias. Nobody ever re-declared, so nothing was ever reviewed.
      The anchor belongs on an atom that is genuinely GAS-bound.
    done_when: the anchor is defined on a Workspace-auth atom and text_block carries its own list
    verify: python3 -m pytest tests/test_schema.py tests/test_staging.py -q

  - id: gate-gas-deployments
    title: Staleness gates for the two GAS deployments and Cloud Run
    dimension: change_safety
    impact: 4
    effort: 3
    confidence: 0.8
    authorisation: green
    why: >
      Only 2 of 5 renderer deploy targets are gated. The ui:// and Worker gates
      exist because their absence cost a day each; the GAS deployments and
      Cloud Run renderer have the same failure mode and no detector.
    decided:
      - "Ask the deployed thing what it is running; do not trust a state file."
      - "Do not chain into renderer-release — it regenerates, so it would always fail."
    done_when: change_safety probe reaches 1.0
    verify: python3 improve_probes/change_safety.py

  - id: surface-param-render-api
    title: surface= on /api/render, honouring works_on/degraded_on per target
    dimension: host_coverage
    impact: 5
    effort: 4
    confidence: 0.7
    authorisation: amber
    why: >
      The endpoint already picks a backend implicitly — the .gs renderers emit
      class="asw-paragraph", web_article.py emits inline styles, for the same
      block. Making the target explicit AND enforcing the compatibility matrix
      turns works_on from documentation into behaviour.
    decided:
      - "surface belongs in the API; host does not — host capability is discovered at runtime."
      - "Workers forbid eval, so any new backend must be compiled in at build time."
    done_when: /api/render accepts surface= and degrades atoms per their declaration
    verify: python3 improve_probes/onramp.py

  - id: metering-axis
    title: Move /api/render and /mcp metering off the IP axis
    dimension: agent_reachability
    impact: 4
    effort: 4
    confidence: 0.5
    authorisation: red
    why: >
      Hashed IP is right for browsers and wrong for servers, which share egress
      — every ChatGPT user would land in one bucket. Needs an issued-key story,
      because anyone can mint a header value.
    done_when: metering is keyed on something the caller cannot forge
    verify: "echo 'manual — needs a key-issuance decision first'; exit 1"

  - id: uid-seeding
    title: Seed .gs uids from a content hash
    # Parked, and deliberately dimensionless. It was tagged change_safety on
    # the first pass and the loop duly selected it — but nothing this work does
    # moves that probe, so finishing it would have produced a zero index delta.
    # A topic that cannot move the dimension it claims is mis-tagged; parking
    # is the honest answer until there is a dimension it genuinely belongs to.
    status: parked
    impact: 2
    effort: 2
    confidence: 0.9
    authorisation: green
    why: >
      321 Math.random() sites make renderer output non-deterministic. Not needed
      for the render cache (which keys on the request), but it would make the
      MCP Apps bundle cacheable and diffs reviewable.
    done_when: identical payloads produce byte-identical .gs renderer output
    verify: "echo 'no probe yet'; exit 1"
