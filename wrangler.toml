name = "a2uicatalog"
account_id = "874e86ca2e6319749c576074fcc72b97"
compatibility_date = "2024-09-23"

# Homepage-only content negotiation (?mode=agent, Accept: text/markdown).
# See src/worker.js for why this exists and why it is scoped this tightly.
main = "src/worker.js"

[assets]
directory = "./public"
binding = "ASSETS"
# Cloudflare's documented convention: serves public/404.html (with a real
# 404 status) for any unmatched path, instead of the platform default —
# an empty body, no Content-Type, on every miss (an agent-readiness
# finding, 2026-08-16: "404s ... lack markdown recovery guidance").
not_found_handling = "404-page"
# The Worker runs FIRST only for the bare homepage. Every other path — all 474
# atom pages, their .md twins, /.well-known/*, openapi.json, images — is served
# straight from assets with no Worker in front of it, so this change cannot add
# latency or a failure mode to anything but "/".
run_worker_first = ["/"]
