name = "a2uicatalog"
account_id = "874e86ca2e6319749c576074fcc72b97"
compatibility_date = "2024-09-23"

# Homepage-only content negotiation (?mode=agent, Accept: text/markdown).
# See src/worker.js for why this exists and why it is scoped this tightly.
main = "src/worker.js"

[assets]
directory = "./public"
binding = "ASSETS"
# Cloudflare's documented convention: serves public/404.html (with a real
# 404 status) for any unmatched path, instead of the platform default —
# an empty body, no Content-Type, on every miss (an agent-readiness
# finding, 2026-08-16: "404s ... lack markdown recovery guidance").
not_found_handling = "404-page"
# The Worker now runs first for every path (2026-10-21) so a miss can be
# answered as a Markdown 404 for clients sending Accept: text/markdown (the
# platform's 404-page handling cannot vary by header). Hits pass straight
# through to env.ASSETS unchanged; only "/" does any negotiation. Cost: one
# Worker invocation per request instead of only for "/".
run_worker_first = true
