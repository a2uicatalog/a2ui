name = "a2uicatalog"
account_id = "874e86ca2e6319749c576074fcc72b97"
compatibility_date = "2024-09-23"

# Homepage-only content negotiation (?mode=agent, Accept: text/markdown).
# See src/worker.js for why this exists and why it is scoped this tightly.
main = "src/worker.js"

[assets]
directory = "./public"
binding = "ASSETS"
# Cloudflare's documented convention: serves public/404.html (with a real
# 404 status) for any unmatched path, instead of the platform default —
# an empty body, no Content-Type, on every miss (an agent-readiness
# finding, 2026-08-16: "404s ... lack markdown recovery guidance").
not_found_handling = "none"
# The Worker runs FIRST only for the bare homepage (Accept negotiation). Every existing file is served straight from
# assets with no Worker in front of it. With not_found_handling = "none", a path NO asset matches falls through to the
# Worker, which answers a Markdown 404 for Accept: text/markdown clients and the site's 404.html (status 404) for
# everyone else (2026-10-21, is-agentic agent-friendly-404). Cost: a Worker invocation per miss and per "/", not per hit.
run_worker_first = ["/"]
