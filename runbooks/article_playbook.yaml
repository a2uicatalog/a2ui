name: article_playbook
kind: stampable
description: >
  Article Playbook — a steered critical reading of someone else's article,
  stamped into a concept_ladder artifact: an attribution bar naming the source,
  a hero mental-model card, then rungs down a rail. The rung progression is
  Toulmin (claim → grounds → warrant), so the analysis lands on the assumption
  joining evidence to conclusion — the thing a summary always drops. The reader
  picks an opening posture and states what they actually care about; that
  steering shapes the rungs after the spine and is recorded in the artifact.
  Fixed frame of reference, model judgement inside it.
triggers:
  - article playbook
  - read this article
  - analyse this article
  - critique this article
  - what does this article mean for
  - teardown
surfaces: [google-apps-script-web, mcp-apps, web]
layout: concept_ladder
# What this runbook needs from the CALLING HOST, declared the way atoms declare
# works_on. `fetch` is not optional here: the contract requires verbatim
# quotations from a source only the caller can read, and nothing is retrieved
# server-side by design (no SSRF surface, no fetch budget, and the URL never
# reaches us). A host without fetch should say so and ask for pasted text as its
# FIRST move — accepting the contract and filling it from memory is the one
# failure this runbook cannot detect and must never invite. Confirmed twice
# 2026-08-03 against a connector-mode host with no browse action.
requires_host:
  - capability: fetch
    reason: >-
      You must read the source article yourself to supply verbatim quotations.
      Without fetch, ask the user to paste the article text before calling this
      runbook with content.
    fallback: ask the user to paste the article text
# Questions the CALLING MODEL must put to the user before filling the contract.
# Returned by emit_runbook_surface's discovery call (runbook_id, no content)
# alongside input_contract/parsing_guide. Ask them in conversation; do not guess
# answers, and do not silently default `concerns` — an unsteered reading and a
# steered one are different products and the user is the only one who knows
# which they want.
elicit:
  - id: lens
    ask: "Which reading do you want — explain, apply to your domain, challenge, or situate it in prior art?"
    options: [explain, apply, challenge, situate]
    default: explain
    note: >
      An opening posture, not a straitjacket — `concerns` below steers the
      rungs after the spine. If the user's concern clearly implies a posture,
      say which one you inferred rather than asking twice.
  - id: domain
    ask: "What's your primary area of interest, so I can test how this transfers? (e.g. a2ui, generative UI, enterprise ops)"
    required_for: [apply]
    note: Accepts several; each becomes its own applied rung.
  - id: concerns
    ask: "Anything specific you want this reading to look for, or push back on?"
    note: >
      Free text, and the highest-value input here — this is what makes the
      reading theirs rather than generic. Verbatim into `source.steered_by`.
composition:
  strategy: concept_ladder_lens
  container_atom: concept_ladder
  rung_atom: concept_rung
  ladder_defaults:
    use_plex_fonts: true
  # Spine rungs are fixed and always rendered first, in this order — the
  # exposition that any later judgement is measured against. Toulmin names in
  # `warrant_role`; `label` is the rendered chip.
  spine:
    - id: claim
      label: CLAIM
      warrant_role: claim
    - id: grounds
      label: GROUNDS
      warrant_role: data
    - id: warrant
      label: WARRANT
      warrant_role: warrant
  # Steered rungs, appended after the spine, chosen by lens. `kind` maps to
  # concept_rung's chip styling: depth = accent chip, example = mono/terminal.
  lenses:
    explain:
      appends: [{ id: so_what, label: SO WHAT, kind: depth }]
    apply:
      appends:
        - { id: transfer, label: TRANSFER CONDITIONS, kind: depth }
        - { id: applied, label: "APPLIED · <domain>", kind: example, repeats: domain }
    challenge:
      appends:
        - { id: steelman, label: STEELMAN, kind: depth }
        - { id: interrogation, label: INTERROGATION, kind: depth }
        - { id: falsify, label: WHAT WOULD FALSIFY, kind: example }
    situate:
      appends:
        - { id: prior_art, label: PRIOR ART, kind: depth }
        - { id: placement, label: PLACEMENT, kind: example }
  content_required:
    ladder: [title, source, model, rungs]
    source: [title, url]
    rung: [label, body]
input_contract:
  title: >
    string (required) — the ANALYSIS's title, stating a claim of its own
    ("Structure Over Capability"). Must not restate the source's headline: two
    pieces with the same title are one piece pretending to be the other.
  source: >
    object (required) — {title, url, author?, publication?, published?,
    read_minutes?, label?, steered_by?, no_public_url?}. The original,
    rendered as an attribution bar ABOVE the headline with `title` as a live
    link. `label` sets the bar's kicker ("Analysis of", "Teardown of",
    "Challenge reading of"). `steered_by` is the user's `concerns` answer,
    verbatim. `url` is required UNLESS the source genuinely has no public
    URL — a document the reader uploaded directly (a PDF or Markdown file,
    not a link they pasted or asked you to fetch) rather than a published,
    linkable page. In that one case, set `no_public_url: true` and omit
    `url` entirely rather than inventing a placeholder link; the attribution
    bar renders `title` as plain text instead of a link when this is set.
    Do NOT set this just because fetching a real URL failed or was
    inconvenient — only when there genuinely is no public page to link to.
  analysed_by: >
    string (optional but STRONGLY WANTED) — the model that produced this
    reading, e.g. "claude-opus-5" or "gemini-2.5-flash". Once more than one
    model can write into a reader's history, this is what makes the history
    interpretable: two readings of one article are only comparable if you know
    which produced each. NOTE IT IS NOT `model` — that field is the mental
    model, the hero card, and has nothing to do with an LLM. Report your own
    name exactly as your system prompt states it; if you do not know it, omit
    this rather than guessing, and the artifact will say the reader was not
    told rather than name the wrong thing.
  eyebrow: >
    string (optional) — who made THIS reading and under which lens, e.g.
    "article playbook · lens: challenge". Never the source's byline; the source
    has its own bar.
  dek: string (optional) — one italic line framing the reading.
  hook: string (optional) — the opening grabber. Backtick spans render as code.
  model: >
    string (required) — the one-line mental model, rendered as the hero THE
    MODEL card. This is the artifact's money shot and the single sentence a
    reader will screenshot: the source's argument compressed to its load-bearing
    idea, in your words, without exceeding its confidence.
  model_note: string (optional) — one elaboration line inside the model card.
  rungs: >
    array (required) of concept_rung objects — {id, kind ('depth'|'example'),
    badge?, label, title?, body, code?, code_caption?, takeaway?}. Spine rungs
    first (CLAIM, GROUNDS, WARRANT), then the lens's appended rungs. Every spine
    rung's `takeaway` MUST be a verbatim quotation from the source.
  closing_note: string (optional) — italic closing line.
  theme: "string (optional) — light (default) or dark."
  palette: >
    object (optional) — paper, paper_raised, ink, ink_soft, line, accent,
    accent_soft, blocked, blocked_soft, cleared, cleared_soft, mono_bg, mono_fg,
    mono_accent. Unset tokens keep the theme default.
parsing_guide: >
  You fetch and read the article with your own tooling; nothing is retrieved on
  this side. Ask the `elicit` questions FIRST, then fill the contract.

  THE SPINE IS NOT OPTIONAL, AND IT COMES FIRST. Three rungs, from the source
  only, before any judgement:

  CLAIM — what the author wants the reader to believe. State it as they would,
  at their level of confidence.
  GROUNDS — the evidence actually offered for it. What is on the page, not what
  a reasonable person might supply.
  WARRANT — the assumption that joins grounds to claim, usually unstated. This
  is the analytical centre of the whole artifact: a summary reports claim and
  grounds, and only a reading names the warrant. If you cannot articulate the
  warrant you have not finished reading.

  Each spine rung carries a VERBATIM quotation from the source in `takeaway`.
  Not a paraphrase — the author's words, so the reader can check your reading
  against the text without leaving the page.

  Only then the steered rungs, per lens:

  explain — SO WHAT: where the claim holds, what it changes, who it binds.
  apply — TRANSFER CONDITIONS first: what must be true for this argument to
  carry into another domain at all. Then one APPLIED rung per domain the user
  named. Conditions before application is what separates a real transfer from a
  glib analogy; a domain that fails the conditions should be told so.
  challenge — STEELMAN first: restate the argument in its strongest form,
  stronger than the author put it if you can. Then INTERROGATION of the warrant
  (attack the joint, not the conclusion). Then WHAT WOULD FALSIFY: name the
  evidence that would settle each disagreement. A challenge that cannot be
  settled by evidence is a complaint, and does not belong in the artifact.
  situate — PRIOR ART and PLACEMENT. Highest hallucination risk in this runbook:
  cite ONLY work you actually retrieved this session. Anything you are
  recalling rather than reading is labelled "unverified, from memory" in the
  rung body, or omitted. Never render an unretrieved title as though it were a
  citation — a fabricated bibliography is worse than an absent lens.

  RULES THAT HOLD ACROSS EVERY LENS:

  1. Never evaluate a claim the spine has not fairly stated. Exposition
  precedes judgement; that ordering is what stops a critique misrepresenting a
  piece it never summarised.
  2. QUALIFIERS SURVIVE. The author's hedges — "may", "in our experience",
  "some evidence suggests" — are load-bearing. Dropping them is the most common
  way a faithful-looking summary becomes false, and no lens may state a claim
  more confidently than its source did.
  3. MARK INFERENCE AS INFERENCE. Reading intent into a decision ("this
  constraint is deliberate governance") is an inference, not an observation,
  and must say so in the prose. An unfalsifiable charitable reading is still an
  unfalsifiable reading.
  4. Attribution and steering stay on screen: `source.url` is a live link
  whenever the source has a public page, and the user's concerns go verbatim
  into `source.steered_by`. A reading that hides what shaped it is making a
  claim about its own neutrality that isn't true. The one exception is a
  document the reader uploaded directly with no public page to link — set
  `source.no_public_url: true` rather than inventing a URL; do not reach for
  this just because fetching was inconvenient.
  5. Disagreeing with the source is allowed and often the point — the value is
  in reaching conclusions the original author did not have in mind. Being
  unfair to it is not. The difference is entirely whether the spine did its job.
