<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Export film · A2UI Catalog</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0d12; color: #eef1f7; font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.1rem; margin: 4px 0 2px; } h1 span { color: #8d98ff; }
  #cap { margin: 0 0 12px; } #cap button { font: inherit; background: #1a1f2b; color: #eef1f7; border: 1px solid #3b4358; border-radius: 999px; padding: 4px 14px; cursor: pointer; } #cap .hint { color: #97a0b2; font-size: .8rem; }
  #st { color: #97a0b2; min-height: 1.5em; margin: 0 0 12px; } #st.err { color: #ff6b81; }
/* LOADER (2026-11-25): atom loader, electron on three orbits, nucleus breathes. Pure CSS, transform/opacity/offset-distance only. */
.ld{width:96px;height:96px;flex:none}
.ld svg{display:block;width:100%;height:100%;overflow:visible}
.ld ellipse{fill:none;stroke-width:1.5;stroke:var(--accent,#5051cf)}
.ld .o2{stroke:var(--accent-2,#009ca7)}
.ld .o3{stroke-width:1.1;opacity:.4}
.ld .nuc{fill:var(--accent,#5051cf);transform-box:fill-box;transform-origin:center;animation:ld-br 2400ms ease-in-out infinite}
.ld .e{fill:var(--accent-2,#009ca7);offset-rotate:0deg;opacity:0;animation:ld-tr 3600ms ease-in-out infinite}
.ld .e1{offset-path:path("M20.48 6.7A10 4.4 -32 0 1 3.52 17.3A10 4.4 -32 0 1 20.48 6.7")}
.ld .e2{offset-path:path("M20.48 17.3A10 4.4 32 0 1 3.52 6.7A10 4.4 32 0 1 20.48 17.3");animation-delay:-2400ms}
.ld .e3{offset-path:path("M12 22A10 4.4 90 0 1 12 2A10 4.4 90 0 1 12 22");animation-delay:-1200ms}
@keyframes ld-tr{0%{offset-distance:0%;opacity:1}30%{offset-distance:100%;opacity:1}33%,100%{offset-distance:100%;opacity:0}}
@keyframes ld-br{50%{transform:scale(1.18)}}
/* reduced motion: the still logo (orbits + nucleus), nothing moves; the site-wide reduce rule already stops the animations */
@media(prefers-reduced-motion:reduce){.ld .nuc{animation:none}.ld .e{animation:none;opacity:0}}

  .ldw { height: 56px; margin: 0 0 4px; opacity: 1; transition: opacity var(--motion-base) var(--motion-ease-exit); } .ldw.done { opacity: 0; visibility: hidden; }
  .ldw .ld { width: 48px; height: 48px; --accent: #8d98ff; --accent-2: #2ac4ce; }
  :root { --motion-base: 300ms; --motion-ease-exit: cubic-bezier(.4,0,1,1); }
  @media (prefers-reduced-motion: reduce) { .ldw { transition: none; } }
  iframe { width: 100%; height: 80vh; border: 0; display: block; background: transparent; }
  footer { color: #97a0b2; font-size: .8rem; margin-top: 10px; } a { color: #8d98ff; }
</style>
</head>
<body>
<main>
  <h1>A2UI <span>film export</span></h1>
  <div class="ldw" id="ldw"><span class="ld" role="img" aria-label="Loading"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse class="o1" cx="12" cy="12" rx="10" ry="4.4" transform="rotate(-32 12 12)"/><ellipse class="o2" cx="12" cy="12" rx="10" ry="4.4" transform="rotate(32 12 12)"/><ellipse class="o3" cx="12" cy="12" rx="10" ry="4.4" transform="rotate(90 12 12)"/><circle class="nuc" cx="12" cy="12" r="2.7"/><circle class="e e1" r="1.25"/><circle class="e e2" r="1.25"/><circle class="e e3" r="1.25"/></svg></span></div>
  <p id="st">Loading the film…</p>
  <p id="cap" hidden><button id="capb" type="button">Captions (.vtt)</button> <span class="hint">Same words and timing as the film, for the MP4 you save.</span></p>
  <iframe id="view" src="/surfaces/mcp-apps/renderer-bundle.html" title="Film"></iframe>
  <footer>Encoded in this browser; nothing is uploaded. <a href="https://a2uicatalog.ai/">a2uicatalog.ai</a></footer>
</main>
<script>
(function () {
  var st = document.getElementById('st'), fr = document.getElementById('view');
  var ldw = document.getElementById('ldw');
  function say(t, err) { st.textContent = t; st.className = err ? 'err' : ''; ldw.classList.add('done'); }
  var h = location.hash.slice(1), p = (h.match(/(?:^|&)p=([^&]+)/) || [])[1], k = (h.match(/(?:^|&)k=(mp4|gif)(?:&|$)/) || [])[1];
  if (!p) { say('There is no film in this link.', 1); return; }
  function unb64u(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
    var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a;
  }
  var payloadP = new Response(new Blob([unb64u(p)]).stream().pipeThrough(new DecompressionStream('gzip'))).text().then(JSON.parse);
  var libP = null;
  function lib() {
    return libP || (libP = new Promise(function (res, rej) {
      var s = document.createElement('script'); s.src = '/vendors/client-export/client_export.min.js';
      s.onload = function () { res(window.ClientExport); }; s.onerror = function () { libP = null; rej(new Error('could not load the exporter')); };
      document.head.appendChild(s);
    }));
  }
  function slug(t) { return String(t || 'film').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'film'; }
  var title = 'film', busy = false, vtt = '';
  function save(blob, name) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); return name;
  }
  function loadVtt() {
    return new Promise(function (res, rej) {
      if (window.FilmVtt) return res(window.FilmVtt);
      var s = document.createElement('script'); s.src = '/vendors/client-export/film_vtt.js';
      s.onload = function () { res(window.FilmVtt); }; s.onerror = function () { rej(new Error('no captions module')); };
      document.head.appendChild(s);
    });
  }
  // Captions beside the MP4: built from the film's own text and the keyframes the player holds; hidden when there are no cues.
  function offerCaptions(payload, w) {
    loadVtt().then(function (FV) {
      var C = FV.configFromScripts(w.document);
      if (!C) return;
      var v = FV.filmToVtt(payload, C);
      if (v.indexOf('-->') < 0) return;
      vtt = v;
      document.getElementById('cap').hidden = false;
      document.getElementById('capb').onclick = function () { say('Saved ' + save(new Blob([vtt], { type: 'text/vtt' }), slug(title) + '.vtt') + '.'); };
    }).catch(function () {});
  }
  // window.A2UIExport for the painted film: its MP4/GIF buttons call this. Capture runs on animation frames,
  // which stop while the tab is hidden, so the export waits until the visitor comes back (and says so).
  function run(root, kind, progress) {
    if (busy) return Promise.reject(new Error('already exporting'));
    busy = true;
    var name = kind === 'gif' ? 'GIF' : 'Video', lock = null;
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (l) { lock = l; }, function () {}); } catch (e) {}
    say(name + ': rendering frames, keep this tab open…');
    return lib().then(function (CE) {
      var f = CE.findFilm(root.ownerDocument, root);
      function onP(d, n) { if (progress) progress(d, n); say(name + ' ' + Math.round(100 * d / (n || 1)) + '%' + (document.hidden ? ' (paused: tab hidden)' : '')); }
      return kind === 'gif' ? CE.exportGif(f, { onProgress: onP })
        : CE.exportVideo(f, { onProgress: onP }).then(function (r) { return r.blob; });
    }).then(function (blob) {
      var ext = blob.type.indexOf('gif') >= 0 ? 'gif' : (blob.type.indexOf('webm') >= 0 ? 'webm' : 'mp4');
      var nm = save(blob, slug(title) + '.' + ext);
      say('Saved ' + nm + '.' + (vtt && ext !== 'gif' ? ' The Captions (.vtt) button saves the matching subtitles.' : ' Press MP4 or GIF under the film for another.'));
    }, function (e) { say('Export failed: ' + (e && e.message || e), 1); throw e; })
      .finally(function () { busy = false; if (lock) lock.release().catch(function () {}); });
  }
  window.addEventListener('message', function (ev) {
    if (ev.source !== fr.contentWindow) return;
    var m = ev.data;
    if (m && m.method === 'ui/notifications/size-changed' && m.params && m.params.height) fr.style.height = Math.ceil(m.params.height) + 'px';
  });
  fr.addEventListener('load', function () {
    payloadP.then(function (payload) {
      title = payload.title || 'film';
      var w = fr.contentWindow;
      w.A2UIExport = { kinds: ['mp4', 'gif'], run: run };   // before painting: the film reads it when it starts
      w._A2UI_PAINT(payload);
      var root = w.document.querySelector('.mt-root');
      if (!root) { say('This link has no film to export.', 1); return; }
      offerCaptions(payload, w);
      say(k ? 'Starting the ' + k.toUpperCase() + ' export…' : 'Press MP4 or GIF under the film.');
      if (k) setTimeout(function () { run(root, k).catch(function () {}); }, 600);
    }).catch(function (e) { say('Could not read the film in this link: ' + (e && e.message || e), 1); });
  });
})();
</script>
</body>
</html>
