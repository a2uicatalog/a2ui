<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mermaid to motion_arch playground</title>
<style>
:root{color-scheme:dark;--bg:#12171f;--fg:#e8edf4;--mut:#9ca5b1;--line:#2c3644;--acc:#8d98ff;--err:#ff8a80;--warn:#f0b45a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
header{padding:14px 16px;border-bottom:1px solid var(--line)}h1{font-size:18px;margin:0 0 4px}header p{margin:0;color:var(--mut);font-size:13px}
main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;padding:16px;max-width:1400px;margin:0 auto}
@media(max-width:860px){main{grid-template-columns:1fr}}
textarea{width:100%;min-height:340px;background:#0d1117;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0;color:var(--mut);font-size:13px}
select,button{background:#1c2430;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit}button{cursor:pointer}button:hover{border-color:var(--acc)}
#msgs{font-size:13px;white-space:pre-wrap}.err{color:var(--err)}.warn{color:var(--warn)}.ok{color:var(--mut)}
iframe{width:100%;border:0;border-radius:12px;background:#05070f;display:block;min-height:420px}
details{margin-top:10px}pre{background:#0d1117;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;max-height:260px;font:12px/1.5 ui-monospace,Menlo,monospace;margin:6px 0}
</style>
</head>
<body>
<header><h1>Mermaid to motion_arch playground</h1>
<p>Paste a Mermaid flowchart. The converter (this page, no network) lays it out and writes a <code>motion_arch</code> payload; the real MCP Apps renderer bundle plays it. See docs/mermaid_arch.md.</p></header>
<main>
<section>
<textarea id="src" spellcheck="false" aria-label="Mermaid flowchart">%% title: Order service
%% msg: client->api "GET /orders"
%% msg: api->db "SELECT"
%% relation-name: Interaction
%% rel: client->api calls
%% rel: api->db queries
%% rel: api->worker queues work
flowchart LR
  client([Browser]):::device
  subgraph backend[Backend]
    api[API gateway]
    worker[[Job worker]]
    db[(Postgres)]
  end
  client -->|HTTPS| api
  api -->|query| db
  api -.->|enqueue| worker
  worker --> db</textarea>
<div class="row">
  <label>Direction <select id="dir"><option value="">as written (auto)</option><option>LR</option><option>TB</option><option>RL</option><option>BT</option></select></label>
  <label><input type="checkbox" id="film" checked> play as a film</label>
  <label><input type="checkbox" id="num" checked> numbered steps</label>
  <label><input type="checkbox" id="rel"> Show relation column</label>
  <label>edges <select id="routing"><option value="orthogonal" selected>routed (right angles)</option><option value="curve">curves</option></select></label>
  <label>pace <select id="pace"><option>slow</option><option selected>normal</option><option>fast</option></select></label>
  <button id="go">Convert</button><button id="copy">Copy payload</button>
</div>
<div id="msgs" class="ok"></div>
<details><summary>Payload JSON</summary><pre id="json"></pre></details>
</section>
<section><iframe id="view" title="A2UI renderer" scrolling="no"></iframe>
<div class="row"><button id="pp">Pause</button><button id="rs">Replay</button><span id="dur"></span><span id="note"></span></div></section>
</main>
<script>
// ---- graph.mjs
// Canonical architecture graph + validator. Pure ES module, no dependencies.
//
// graph = {
//   title?: string,
//   direction: 'LR' | 'RL' | 'TB' | 'BT',
//   groups:   [{id, label}],
//   nodes:    [{id, label, kind?, sub?, group?}],
//   edges:    [{from, to, label?, style: 'sync'|'async'|'optional', both?, step?, relation?}],
//   messages: [{from, to, text, back?}],
//   numbered?, pace?, duration?, relationColumn?: boolean, relationName?: string (max 20, default 'Relation'),
// }
//
// Limits are the motion_arch atom's own (atoms/schema.yaml, renderers/web_article.py).

const LIMITS = Object.freeze({
  nodes: 12, edges: 16, groups: 4, messages: 12,
  label: 40, sub: 40, groupLabel: 40, edgeLabel: 48, msgText: 40, title: 80, relation: 20,
});
const KINDS = Object.freeze(['device', 'app', 'server', 'tool', 'model', 'store', 'surface', 'user']);
const STYLES = Object.freeze(['sync', 'async', 'optional']);
const PACES = Object.freeze({ slow: 1.4, normal: 1.0, fast: 0.75 });
const DIRECTIONS = Object.freeze(['LR', 'RL', 'TB', 'BT']);
const ID_RE = /^[a-z][a-z0-9_-]{0,31}$/;

// Friendly names that map onto the 8 atom kinds.
const KIND_ALIASES = Object.freeze({
  client: 'device', browser: 'device', phone: 'device', mobile: 'device', laptop: 'device', device: 'device',
  db: 'store', database: 'store', cache: 'store', bucket: 'store', storage: 'store', datastore: 'store', store: 'store',
  queue: 'tool', mcp: 'tool', auth: 'tool', tool: 'tool',
  gateway: 'server', cdn: 'server', proxy: 'server', backend: 'server', server: 'server', worker: 'server',
  service: 'app', agent: 'app', app: 'app', application: 'app', frontend: 'app',
  llm: 'model', ai: 'model', model: 'model',
  external: 'surface', ui: 'surface', screen: 'surface', renderer: 'surface', surface: 'surface',
  person: 'user', actor: 'user', human: 'user', user: 'user',
});

class ArchError extends Error {
  constructor(errors, warnings = []) {
    const list = Array.isArray(errors) ? errors : [errors];
    super(list.join('\n'));
    this.name = 'ArchError';
    this.errors = list;
    this.warnings = warnings;
  }
}

function resolveKind(name) {
  if (typeof name !== 'string') return undefined;
  return KIND_ALIASES[name.trim().toLowerCase()];
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}

// Closest candidate, or undefined when nothing is plausibly a typo.
function didYouMean(word, candidates) {
  const w = String(word).toLowerCase();
  let best, bestD = Infinity;
  for (const c of candidates) {
    const d = levenshtein(w, String(c).toLowerCase());
    if (d < bestD) { bestD = d; best = c; }
  }
  const limit = Math.max(1, Math.min(3, Math.floor(Math.max(w.length, 3) / 3)));
  return bestD <= limit ? best : undefined;
}

function hint(word, candidates) {
  const s = didYouMean(word, candidates);
  return s !== undefined ? ` (did you mean "${s}"?)` : '';
}

function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

// Step numbers for the edges. Default: the order of the edges in the source. An edge may carry `step`
// (from a `%% step: a->b 3` line) to override; the other edges then take the lowest unused numbers in
// source order. Returns {steps: number[] (per edge), errors: string[]}.
function assignSteps(graph) {
  const edges = Array.isArray(graph.edges) ? graph.edges : [];
  const n = edges.length, errors = [], steps = new Array(n).fill(0);
  const owner = new Map();
  edges.forEach((e, i) => {
    if (e.step === undefined) return;
    const d = `edge ${i + 1} (${e.from} -> ${e.to})`;
    if (!Number.isInteger(e.step) || e.step < 1) { errors.push(`${d}: step must be a whole number from 1 to ${n}`); return; }
    if (e.step > n) { errors.push(`${d}: step ${e.step} is larger than the number of edges (${n}); steps must run 1 to ${n} with no gaps`); return; }
    if (owner.has(e.step)) { errors.push(`step ${e.step} is given to both edge ${owner.get(e.step) + 1} and edge ${i + 1}; each step number can be used once`); return; }
    owner.set(e.step, i); steps[i] = e.step;
  });
  let next = 1;
  edges.forEach((e, i) => {
    if (steps[i]) return;
    if (e.step !== undefined) return;
    while (owner.has(next)) next++;
    owner.set(next, i); steps[i] = next;
  });
  if (!errors.length) {
    for (let k = 1; k <= n; k++) if (!owner.has(k)) errors.push(`step ${k} is missing; steps must run 1 to ${n} with no gaps`);
  }
  return { steps, errors };
}

// Returns {errors:[string], warnings:[string]}. Numbering in messages is 1-based.
function validateGraph(g) {
  const errors = [], warnings = [];
  if (!g || typeof g !== 'object') return { errors: ['graph must be an object with nodes and edges'], warnings };
  const nodes = Array.isArray(g.nodes) ? g.nodes : [];
  const edges = Array.isArray(g.edges) ? g.edges : [];
  const groups = Array.isArray(g.groups) ? g.groups : [];
  const messages = Array.isArray(g.messages) ? g.messages : [];

  if (g.direction !== undefined && !DIRECTIONS.includes(g.direction)) {
    errors.push(`direction "${g.direction}" is not one of ${DIRECTIONS.join(', ')}`);
  }
  if (!nodes.length) errors.push('the graph has no nodes; add at least one node');

  // groups
  const groupIds = new Set();
  groups.forEach((gr, i) => {
    if (!gr || typeof gr.id !== 'string' || !gr.id) { errors.push(`group ${i + 1}: needs an id`); return; }
    if (groupIds.has(gr.id)) errors.push(`group ${i + 1}: id "${gr.id}" is used twice; group ids must be unique`);
    groupIds.add(gr.id);
    if (typeof gr.label !== 'string' || !gr.label.trim()) errors.push(`group ${i + 1} ("${gr.id}"): needs a label`);
    else if (gr.label.length > LIMITS.groupLabel) {
      warnings.push(`group "${gr.id}": label is ${gr.label.length} characters; the atom shows at most ${LIMITS.groupLabel}, so it will be cut. Shorten it.`);
    }
  });

  // nodes
  const ids = new Set();
  nodes.forEach((n, i) => {
    const at = `node ${i + 1}`;
    if (!n || typeof n.id !== 'string' || !n.id) { errors.push(`${at}: needs an id`); return; }
    if (!ID_RE.test(n.id)) {
      errors.push(`${at}: id "${n.id}" is not valid; use a lowercase letter first, then lowercase letters, digits, "_" or "-", up to 32 characters`);
    }
    if (ids.has(n.id)) errors.push(`${at}: id "${n.id}" is used twice; node ids must be unique`);
    ids.add(n.id);
    if (typeof n.label !== 'string' || !n.label.trim()) errors.push(`${at} ("${n.id}"): needs a label`);
    else if (n.label.length > LIMITS.label) {
      warnings.push(`node "${n.id}": label is ${n.label.length} characters; the atom shows at most ${LIMITS.label}, so it will be cut. Shorten it or move detail into the sub-label.`);
    }
    if (n.sub !== undefined && String(n.sub).length > LIMITS.sub) {
      warnings.push(`node "${n.id}": sub-label is ${String(n.sub).length} characters; the atom shows at most ${LIMITS.sub}.`);
    }
    if (n.kind !== undefined && !KINDS.includes(n.kind)) {
      errors.push(`node "${n.id}": kind "${n.kind}" is not one of ${KINDS.join(', ')}` + (resolveKind(n.kind) ? ` (did you mean "${resolveKind(n.kind)}"?)` : hint(n.kind, KINDS)));
    }
    if (n.group !== undefined && !groupIds.has(n.group)) {
      errors.push(`node "${n.id}": group "${n.group}" is not a group id` + hint(n.group, [...groupIds]));
    }
  });

  // edges
  const ndList = [...ids];
  const touched = new Set();
  edges.forEach((e, i) => {
    const at = `edge ${i + 1}`;
    if (!e || typeof e !== 'object') { errors.push(`${at}: must be an object with from and to`); return; }
    let bad = false;
    for (const end of ['from', 'to']) {
      if (typeof e[end] !== 'string' || !ids.has(e[end])) {
        errors.push(`${at}: "${e[end]}" is not a node id${hint(e[end] ?? '', ndList)}`);
        bad = true;
      }
    }
    if (bad) return;
    if (e.from === e.to) { errors.push(`${at}: "${e.from}" points at itself; the atom cannot draw self-loops. Remove the edge or add a second node.`); return; }
    if (e.style !== undefined && !STYLES.includes(e.style)) {
      errors.push(`${at}: style "${e.style}" is not one of ${STYLES.join(', ')}`);
    }
    if (e.label !== undefined && String(e.label).length > LIMITS.edgeLabel) {
      warnings.push(`${at}: label is ${String(e.label).length} characters; the atom shows at most ${LIMITS.edgeLabel}.`);
    }
    touched.add(e.from); touched.add(e.to);
  });
  const seen = new Map();
  edges.forEach((e, i) => {
    if (!e || e.from === e.to) return;
    const k = e.from + '>' + e.to + '|' + (e.style || 'sync') + '|' + (e.label || '');
    if (seen.has(k)) warnings.push(`edge ${i + 1}: duplicates edge ${seen.get(k)} (${e.from} -> ${e.to}); consider merging them into one labelled edge.`);
    else seen.set(k, i + 1);
  });
  nodes.forEach((n) => {
    if (n && ids.has(n.id) && !touched.has(n.id) && nodes.length > 1) {
      warnings.push(`node "${n.id}" has no edges; it will sit on its own in the layout. Connect it or remove it.`);
    }
  });

  // messages
  messages.forEach((m, i) => {
    const at = `message ${i + 1}`;
    if (!m || typeof m !== 'object') { errors.push(`${at}: must be an object with from, to and text`); return; }
    let bad = false;
    for (const end of ['from', 'to']) {
      if (typeof m[end] !== 'string' || !ids.has(m[end])) {
        errors.push(`${at}: "${m[end]}" is not a node id${hint(m[end] ?? '', ndList)}`);
        bad = true;
      }
    }
    if (bad) return;
    if (typeof m.text !== 'string' || !m.text.trim()) { errors.push(`${at}: needs text (the payload chip)`); return; }
    if (m.text.length > LIMITS.msgText) warnings.push(`${at}: text is ${m.text.length} characters; the atom shows at most ${LIMITS.msgText}.`);
    const fwd = edges.some((e) => e && e.from === m.from && e.to === m.to);
    const rev = edges.some((e) => e && e.from === m.to && e.to === m.from);
    if (!fwd && !rev) {
      errors.push(`${at}: there is no edge between "${m.from}" and "${m.to}" for the chip to ride; add that edge or fix the ids`);
    } else if (!fwd && rev) {
      warnings.push(`${at}: only the edge ${m.to} -> ${m.from} exists, so the chip "${m.text}" rides it backwards (reply direction).`);
    }
  });

  edges.forEach((e, i) => {
    if (e && e.relation !== undefined && (typeof e.relation !== 'string' || e.relation.length > LIMITS.relation)) errors.push(`edge ${i + 1}: relation must be text of at most ${LIMITS.relation} characters (for example "calls" or "reports back")`);
  });
  if (g.relationName !== undefined && (typeof g.relationName !== 'string' || !g.relationName.trim() || g.relationName.length > LIMITS.relation)) errors.push(`relationName must be 1 to ${LIMITS.relation} characters`);
  if (g.relationColumn !== undefined && typeof g.relationColumn !== 'boolean') errors.push('relationColumn must be true or false');
  if (g.pace !== undefined && !Object.hasOwn(PACES, g.pace)) errors.push(`pace "${g.pace}" is not one of ${Object.keys(PACES).join(', ')}`);
  if (g.duration !== undefined && !(typeof g.duration === 'number' && g.duration >= 2 && g.duration <= 120)) errors.push(`duration "${g.duration}" must be a number of seconds from 2 to 120`);
  if (g.numbered || edges.some((e) => e && e.step !== undefined)) {
    if (!errors.some((e) => /^edge \d+: "/.test(e))) errors.push(...assignSteps(g).errors);
  }
  // caps: never truncate silently, tell the user how to split
  const groupSizes = groups.map((gr) => [gr.label || gr.id, nodes.filter((n) => n && n.group === gr.id).length]).sort((a, b) => b[1] - a[1]);
  if (nodes.length > LIMITS.nodes) {
    const over = nodes.length - LIMITS.nodes;
    let how = 'Split it into two diagrams (one per subsystem), or merge small nodes into one.';
    if (groupSizes.length > 1) how = `Split it by group: ${groupSizes.slice(0, 4).map(([l, c]) => `"${l}" has ${plural(c, 'node', 'nodes')}`).join(', ')}; draw one diagram per group, or collapse a group into a single node.`;
    errors.push(`the graph has ${nodes.length} nodes; the atom draws at most ${LIMITS.nodes} (${over} over). ${how}`);
  }
  if (edges.length > LIMITS.edges) {
    errors.push(`the graph has ${edges.length} edges; the atom draws at most ${LIMITS.edges}. Remove the ${edges.length - LIMITS.edges} least important, merge duplicate calls into one labelled edge, or split into two diagrams.`);
  }
  if (groups.length > LIMITS.groups) {
    errors.push(`the graph has ${groups.length} groups; the atom draws at most ${LIMITS.groups}. Merge related groups, or turn the smallest into plain nodes.`);
  }
  if (messages.length > LIMITS.messages) {
    errors.push(`the graph has ${messages.length} messages; the atom animates at most ${LIMITS.messages}. Keep the ${LIMITS.messages} that tell the story.`);
  }
  if (g.title !== undefined && String(g.title).length > LIMITS.title) {
    warnings.push(`title is ${String(g.title).length} characters; the atom keeps at most ${LIMITS.title} for the accessible name.`);
  }
  return { errors, warnings };
}

// ---- schedule.mjs
// Pacing: how long each step of the film stays on screen. Timing only, derived from the content.
//
//   dwell(step) = max(1.8 s, words in the step's sentence / 4 per second + 0.5 s)
//                 x 1.1 when the diagram has more than 6 steps, x 1.1 again above 9 steps
//                 x pace (slow 1.4, normal 1.0, fast 0.75)
//   a step with several message chips is stretched so every chip rides inside its own step
//   total = LEAD_IN (1 s: groups and nodes pop) + sum of dwells + HOLD (2 s on the finished diagram)
//   (a 10-step diagram plays in about 30 s at the normal pace)
//
// `duration` (seconds) overrides the total: the dwells are scaled to fit, with a warning when that is
// shorter than the fast-pace reading time.

const LEAD_IN = 1, HOLD = 2, MIN_DWELL = 1.8, WORDS_PER_SECOND = 4, READ_PAD = 0.5, CHIP_SECONDS = 2.0, CHIP_GAP = 0.15, CHIP_START = 0.55, CHIP_TAIL = 0.3;

const words = (t) => (String(t || '').trim() ? String(t).trim().split(/\s+/).length : 0);

// steps: [{words, chips}] in playing order (words = words in the step's sentence)
function buildSchedule(steps, { pace = 'normal', duration } = {}) {
  const warnings = [];
  if (!Object.hasOwn(PACES, pace)) throw Object.assign(new Error(`pace "${String(pace)}" is not one of ${Object.keys(PACES).join(', ')}`), { archMessage: true });
  const mult = PACES[pace];
  const n = steps.length;
  const crowd = n > 9 ? 1.1 * 1.1 : n > 6 ? 1.1 : 1;
  const base = (st, m) => {
    let d = Math.max(MIN_DWELL, st.words / WORDS_PER_SECOND + READ_PAD) * crowd * m;
    const need = CHIP_START + st.chips * CHIP_SECONDS + Math.max(0, st.chips - 1) * CHIP_GAP + CHIP_TAIL;
    return Math.max(d, need);
  };
  let dwell = steps.map((st) => base(st, mult));
  const fast = LEAD_IN + HOLD + steps.reduce((a, st) => a + base(st, PACES.fast), 0);
  if (duration !== undefined) {
    const room = duration - LEAD_IN - HOLD;
    const sum = dwell.reduce((a, b) => a + b, 0);
    if (room <= 0 || (n && room < 0.3 * n)) {
      throw Object.assign(new Error(`duration ${duration} s leaves no time for ${n} steps after the ${LEAD_IN} s lead-in and ${HOLD} s hold`), { archMessage: true });
    }
    if (duration < fast - 1e-9) warnings.push(`duration ${duration} s is shorter than the ${fast.toFixed(1)} s the steps need at the fast pace; readers will not have time to take each step in. Raise it or drop %% duration.`);
    const k = n ? room / sum : 1;
    dwell = dwell.map((d) => d * k);
  }
  const schedule = [];
  let t = LEAD_IN;
  dwell.forEach((d, i) => { schedule.push({ step: i + 1, start: round(t), end: round(t + d) }); t += d; });
  const total = duration !== undefined ? duration : round(t + HOLD);
  return { schedule, durationSeconds: round(total), warnings, minimumSeconds: round(fast) };
}
const round = (x) => Math.round(x * 1000) / 1000;

// ---- activity.mjs
// The steps table's `Activity` column: one plain-English sentence per edge, built from the two node labels and
// the edge label by a fixed template. No model, no randomness: the same graph gives the same sentences.
//
//   edge label      sentence
//   (none)          "<From> calls the <to>"
//   noun phrase     "<From> sends the <label> to the <to>"   ("the" only before a lower-case plain word)
//   a reply         "<From> returns the <label> to the <to>" (a sync edge whose reverse edge is in the diagram too)
//   verb phrase     "<From> <verb> <rest> <preposition> the <to>" for a known leading verb ("types prompt" -> "... types prompt into the client app")
//   single verb     "<From> <verb> the <to>"                  ("asks" -> "User asks the orchestrator")
//   both ways       "<From> and the <to> exchange <label>"
//   async / optional edges end in " (async)" / " (optional)"
// Node names inside a sentence are lower-case except acronyms and camelCase (ADK, A2UI, postMessage); the first word
// is capitalised; no colons or arrows (a "ui://" in a name loses its colon).
//
// A row of the film is one line of at most 60 characters: rowText() tries the full sentence, then the sentence
// without "the", and only then cuts it with an ellipsis. The standalone `table`
// atom always carries the full sentence.

// third-person verbs the template recognises at the start of an edge label, with the preposition that links the rest to the target
const LEAD_VERBS = Object.freeze({
  'looks up': 'in', types: 'into', asks: '', answers: '', creates: 'in', discovers: 'from', reads: 'from', writes: 'to', mounts: 'in',
  dispatches: 'to', streams: 'to', sends: 'to', posts: 'to', calls: '', fetches: 'from', renders: 'in', returns: 'to', lists: 'from',
  saves: 'in', stores: 'in', loads: 'from', requests: 'from', checks: '', validates: '', notifies: '', hands: 'to', forwards: 'to',
  publishes: 'to', subscribes: 'to', queries: '', updates: '', deletes: 'from', opens: '', pushes: 'to', pulls: 'from', resolves: '',
  verifies: '', signs: '', receives: 'from', reports: 'to', triggers: '', invokes: '', runs: 'on', executes: '',
});

// plain text only: no colons ("ui://" loses its colon and slashes, "events: x" becomes "events, x"), no arrows
const plain = (t) => String(t).replace(/:\/\//g, ' ').replace(/\s*:\s*/g, ', ').replace(/\s*(?:->|-->|=>|→)\s*/g, ' to ').replace(/\s+/g, ' ').trim();
// a node label inside a sentence: lower-case words, except acronyms and camelCase names (ADK, A2UI, AG-UI, postMessage)
const keep = (w) => /[A-Z]/.test(w.slice(1)) || /^[A-Z0-9]{2,}/.test(w);
const inSentence = (label) => plain(label).split(' ').map((w) => (keep(w) ? w : w.toLowerCase())).join(' ');

// forward: ("X sends <what> to Y"), a reply to an earlier edge in the other direction ("X returns <what> to Y"),
// a verb phrase ("X types prompt into the Y"), both ways ("X and Y exchange <what>")
function activity(fromLabel, toLabel, label, { style, both, reply } = {}) {
  const F = inSentence(fromLabel), T = 'the ' + inSentence(toLabel), L = inSentence(label || '');
  let s;
  if (!L) {
    s = both ? `${F} and ${T} talk to each other` : `${F} calls ${T}`;
  } else {
    const verb = Object.keys(LEAD_VERBS).find((v) => L === v || L.startsWith(v + ' '));
    if (verb) {
      const rest = L.slice(verb.length).trim();
      const prep = LEAD_VERBS[verb];
      if (!rest) s = `${F} ${verb} ${T}`;
      else if (/^(and|or)\b/i.test(rest) || both) s = `${F} ${verb} ${rest} ${T}`;
      else s = `${F} ${verb} ${rest} ${prep || 'with'} ${T}`;
    } else if (both) {
      s = `${F} and ${T} exchange ${/^[a-z][a-z ]*$/.test(L) ? 'the ' : ''}${L}`;
    } else {
      const article = /^[a-z][a-z ,+-]*$/.test(L) ? 'the ' : '';   // lower-case plain words only: not "A2UI JSON", "tools/call", "POST run"
      s = `${F} ${reply && style !== 'async' && style !== 'optional' ? 'returns' : 'sends'} ${article}${L} to ${T}`;
    }
  }
  if (style === 'async') s += ' (async)';
  else if (style === 'optional') s += ' (optional)';
  return s[0].toUpperCase() + s.slice(1);
}

// a row of the film's table: "*N*  sentence", at most `max` characters: the sentence, then without "the", then cut with an ellipsis
function rowText(step, sentence, max = 60) {
  const pre = `*${step}*  `;
  for (const t of [sentence, sentence.replace(/ the /g, ' ')]) if ((pre + t).length <= max) return pre + t;
  const t = sentence.replace(/ the /g, ' '), room = max - pre.length;
  return pre + t.slice(0, room - 1).trimEnd() + '…';
}

// ---- mermaid.mjs
// Mermaid flowchart subset -> canonical graph. Pure ES module, no dependencies.
// See docs/mermaid_arch.md for the supported syntax. Unsupported input gives a
// plain error naming the line; the parser never throws anything but ArchError.

const OTHER_DIAGRAMS = {
  sequencediagram: 'Draw each participant as a node and each message as an edge in a flowchart.',
  classdiagram: 'Draw each class as a node and each relation as an edge in a flowchart.',
  statediagram: 'Draw each state as a node and each transition as an edge in a flowchart.',
  'statediagram-v2': 'Draw each state as a node and each transition as an edge in a flowchart.',
  erdiagram: 'Draw each entity as a node and each relation as an edge in a flowchart.',
  gantt: 'Gantt charts are timelines, not architecture; use a flowchart of the components instead.',
  pie: 'Pie charts are not architecture diagrams.',
  journey: 'User journeys are not supported; use a flowchart.',
  gitgraph: 'Git graphs are not supported; use a flowchart.',
  mindmap: 'Mind maps are not supported; use a flowchart.',
  timeline: 'Timelines are not supported; use a flowchart.',
  c4context: 'C4 diagrams are not supported; use a flowchart with subgraphs for the boundaries.',
  c4container: 'C4 diagrams are not supported; use a flowchart with subgraphs for the boundaries.',
  c4component: 'C4 diagrams are not supported; use a flowchart with subgraphs for the boundaries.',
  'architecture-beta': 'architecture-beta is not supported; use a flowchart with subgraphs for the groups.',
  'block-beta': 'block-beta is not supported; use a flowchart.',
  'sankey-beta': 'Sankey diagrams are not supported; use a flowchart.',
  'xychart-beta': 'Charts are not supported; use a flowchart.',
  quadrantchart: 'Quadrant charts are not supported; use a flowchart.',
  requirementdiagram: 'Requirement diagrams are not supported; use a flowchart.',
  kanban: 'Kanban boards are not supported; use a flowchart.',
  packet: 'Packet diagrams are not supported; use a flowchart.',
};

// shape delimiters, longest opener first
const SHAPES = [
  ['((', '))', 'circle'], ['([', '])', 'stadium'], ['[(', ')]', 'cylinder'], ['[[', ']]', 'subroutine'],
  ['{{', '}}', 'hexagon'], ['(', ')', 'round'], ['[', ']', 'rect'], ['{', '}', 'diamond'],
];
// default kind per shape (documented in docs/mermaid_arch.md)
const SHAPE_KIND = Object.freeze({
  cylinder: 'store', subroutine: 'tool', stadium: 'device', circle: 'model', hexagon: 'app',
  round: 'app', diamond: 'tool', rect: 'server', plain: 'server',
});
// Mermaid 11 "@{ shape: x }" names -> our shape classes
const AT_SHAPES = {
  cyl: 'cylinder', cylinder: 'cylinder', 'lin-cyl': 'cylinder', 'h-cyl': 'cylinder', 'das': 'cylinder', database: 'cylinder', db: 'cylinder',
  circle: 'circle', circ: 'circle', 'sm-circ': 'circle', 'dbl-circ': 'circle',
  stadium: 'stadium', terminal: 'stadium', pill: 'stadium',
  subproc: 'subroutine', subroutine: 'subroutine', 'fr-rect': 'subroutine',
  hex: 'hexagon', hexagon: 'hexagon', prepare: 'hexagon',
  rounded: 'round', event: 'round',
  rect: 'rect', rectangle: 'rect', proc: 'rect', process: 'rect', square: 'rect',
  diamond: 'diamond', decision: 'diamond', question: 'diamond',
};

const ID_START = /[A-Za-z0-9_]/;

function stripQuotes(s) {
  let t = s.trim();
  if (t.length >= 2 && t[0] === '"' && t[t.length - 1] === '"') t = t.slice(1, -1);
  else if (t.length >= 2 && t[0] === '`' && t[t.length - 1] === '`') t = t.slice(1, -1);
  return t;
}

function decodeEntities(s) {
  return s
    .replace(/#quot;/g, '"').replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/#(\d+);/g, (_, n) => String.fromCharCode(+n));
}

// "Agent runtime<br/>on ADK" -> {label:'Agent runtime', sub:'on ADK'}
function splitLabel(raw) {
  const t = decodeEntities(stripQuotes(raw));
  const parts = t.split(/<br\s*\/?>/i).map((p) => p.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim()).filter(Boolean);
  if (!parts.length) return { label: '' };
  return parts.length === 1 ? { label: parts[0] } : { label: parts[0], sub: parts.slice(1).join(' ') };
}

function cleanText(raw) {
  const t = decodeEntities(stripQuotes(raw)).split(/<br\s*\/?>/i).map((p) => p.replace(/<[^>]+>/g, '')).join(' ');
  return t.replace(/\s+/g, ' ').trim();
}

// split a line at ';' outside quotes
function splitStatements(line) {
  const out = []; let cur = ''; let q = false;
  for (const ch of line) {
    if (ch === '"') q = !q;
    if (ch === ';' && !q) { out.push(cur); cur = ''; } else cur += ch;
  }
  out.push(cur);
  return out.map((s) => s.trim()).filter(Boolean);
}

// remove a trailing "%% comment" that sits outside quotes
function stripTrailingComment(s) {
  let q = false;
  for (let i = 0; i < s.length - 1; i++) {
    if (s[i] === '"') q = !q;
    if (!q && s[i] === '%' && s[i + 1] === '%' && (i === 0 || /\s/.test(s[i - 1]))) return s.slice(0, i).trimEnd();
  }
  return s;
}

function slug(s) {
  return s.toLowerCase().replace(/[^a-z0-9_-]+/g, '_').replace(/^_+|_+$/g, '') || 'x';
}

// deterministic, collision-safe map to the atom id rule ^[a-z][a-z0-9_-]{0,31}$
function makeIdMapper() {
  const used = new Set();
  const byOrig = new Map();
  return (orig) => {
    if (byOrig.has(orig)) return byOrig.get(orig);
    let base = orig.toLowerCase().replace(/[^a-z0-9_-]/g, '_');
    if (!/^[a-z]/.test(base)) base = 'n' + base;
    base = base.slice(0, 32);
    let id = base, k = 2;
    while (used.has(id)) { const suf = '_' + k++; id = base.slice(0, 32 - suf.length) + suf; }
    used.add(id); byOrig.set(orig, id);
    return id;
  };
}

const MAX_INPUT_CHARS = 20000, MAX_LINE_CHARS = 500;   // keeps backtracking in matchLink and the & cross product bounded
function parseMermaid(text, opts = {}) {
  const errors = [], warnings = [];
  const fail = (line, msg) => errors.push(`line ${line}: ${msg}`);
  const warn = (line, msg) => warnings.push(`line ${line}: ${msg}`);
  if (typeof text !== 'string') throw new ArchError(['input must be Mermaid text (a string)']);
  if (text.length > MAX_INPUT_CHARS) throw new ArchError([`input is ${text.length} characters; the most this converter reads is ${MAX_INPUT_CHARS}. A diagram this atom can show is far smaller.`]);
  const lines = text.replace(/^﻿/, '').replace(/\r\n?/g, '\n').split('\n');
  const longLine = lines.findIndex((l) => l.length > MAX_LINE_CHARS);
  if (longLine >= 0) throw new ArchError([`line ${longLine + 1}: ${lines[longLine].length} characters; the most one line may hold is ${MAX_LINE_CHARS}. Split it over several lines.`]);

  const nodes = new Map();          // orig -> {orig,label,sub,shape,hints:[],group,order,line}
  const edges = [];                 // {from,to,label,style,both,line}
  const groupsByKey = new Map();    // key -> {key,label,order}
  const groupStack = [];            // [{key,label,nested}]
  const classStmts = [];            // {line, ids, cls}
  const msgDirectives = [];         // {line, from, to, text, back}
  const stepDirectives = [];         // {line, from, to, step}
  let title, numbered, pace, duration, relationColumn, relationName, direction = 'TB', headerSeen = false, openLinkWarned = false;
  const relDirectives = [];         // {line, from, to, text}

  function touchNode(orig, line) {
    let n = nodes.get(orig);
    if (!n) { n = { orig, label: undefined, sub: undefined, shape: undefined, hints: [], group: undefined, order: nodes.size, line }; nodes.set(orig, n); }
    if (groupStack.length) {
      const outer = groupStack[0].key;
      if (n.group === undefined) n.group = outer;
      else if (n.group !== outer) warn(line, `node "${orig}" is listed in more than one subgraph; keeping it in "${groupsByKey.get(n.group).label}".`);
    }
    return n;
  }

  // ---- node reference: id [shape text] [@{..}] [:::class]
  function parseNodeRef(s, i0, line) {
    let i = i0;
    while (s[i] === ' ' || s[i] === '\t') i++;
    const start = i;
    while (i < s.length) {
      const c = s[i];
      if (ID_START.test(c)) i++;
      else if (c === '-' && i + 1 < s.length && /[A-Za-z0-9_]/.test(s[i + 1]) && i > start) i++;
      else break;
    }
    if (i === start) {
      fail(line, `expected a node id at "${s.slice(i0).trim().slice(0, 20)}"; node ids are letters, digits and underscores (write A[Label] or A --> B)`);
      return null;
    }
    const orig = s.slice(start, i);
    const ref = { orig, hints: [] };
    // unsupported shape openers
    if (s.startsWith('[/', i) || s.startsWith('[\\', i) || s[i] === '>') {
      fail(line, `node "${orig}": this shape (parallelogram/trapezoid/asymmetric) is not supported; use [text], (text), ([text]), [[text]], [(text)], ((text)), {{text}} or {text}`);
      return null;
    }
    if (s.startsWith('(((', i)) { fail(line, `node "${orig}": double circles "(((text)))" are not supported; use ((text))`); return null; }
    for (const [open, close, shape] of SHAPES) {
      if (!s.startsWith(open, i)) continue;
      let j = i + open.length;
      while (s[j] === ' ') j++;
      let txt;
      if (s[j] === '"') {
        const e = s.indexOf('"', j + 1);
        if (e < 0) { fail(line, `node "${orig}": the quote opened here is never closed; add a closing "`); return null; }
        txt = s.slice(j + 1, e);
        let k = e + 1;
        while (s[k] === ' ') k++;
        if (!s.startsWith(close, k)) { fail(line, `node "${orig}": expected "${close}" after the quoted text`); return null; }
        i = k + close.length;
      } else {
        const e = s.indexOf(close, j);
        if (e < 0) { fail(line, `node "${orig}": missing closing "${close}"; if the text contains brackets or parentheses, wrap it in quotes: ${orig}["text (like this)"]`); return null; }
        txt = s.slice(j, e);
        i = e + close.length;
      }
      ref.shape = shape;
      Object.assign(ref, splitLabel(txt));
      break;
    }
    // Mermaid 11: A@{ shape: cyl, label: "x" }
    if (s.startsWith('@{', i)) {
      const e = s.indexOf('}', i);
      if (e < 0) { fail(line, `node "${orig}": "@{" is never closed with "}"`); return null; }
      const body = s.slice(i + 2, e);
      const sm = body.match(/shape\s*:\s*([\w-]+)/);
      const lm = body.match(/label\s*:\s*("([^"]*)"|[^,]+)/);
      if (sm) {
        const sh = AT_SHAPES[sm[1].toLowerCase()];
        if (sh) ref.shape = sh;
        else { ref.shape = 'rect'; warn(line, `node "${orig}": shape "${sm[1]}" is not known; treated as a plain box.`); }
      }
      if (lm) Object.assign(ref, splitLabel(lm[2] !== undefined ? lm[2] : lm[1]));
      i = e + 1;
    }
    // :::class (also "A:::user" right after the id)
    while (s.startsWith(':::', i)) {
      const m = /^:::([A-Za-z0-9_-]+)/.exec(s.slice(i));
      if (!m) { fail(line, `node "${orig}": ":::" must be followed by a class name, for example ${orig}:::server`); return null; }
      ref.hints.push(m[1]); i += m[0].length;
    }
    ref.end = i;
    return ref;
  }

  function applyRef(ref, line) {
    const n = touchNode(ref.orig, line);
    if (ref.label !== undefined && ref.label !== '') { n.label = ref.label; n.sub = ref.sub; }
    if (ref.shape) n.shape = ref.shape;
    n.hints.push(...ref.hints);
    return n;
  }

  // ---- links
  function matchLink(rest) {
    let m;
    // text inside the line: -- text -->, -. text .->, == text ==>
    if ((m = /^(<?)--\s+(.+?)\s+(-{2,}>|-{3,})(?=\s|$|[A-Za-z0-9_])/.exec(rest)) && !/^(<?)--\s*>/.test(rest)) {
      return { len: m[0].length, both: !!m[1] && m[3].endsWith('>'), style: 'sync', open: !m[3].endsWith('>'), label: m[2] };
    }
    if ((m = /^(<?)-\.\s+(.+?)\s+(\.-+>?)(?=\s|$|[A-Za-z0-9_])/.exec(rest))) {
      return { len: m[0].length, both: !!m[1] && m[3].endsWith('>'), style: 'async', open: !m[3].endsWith('>'), label: m[2] };
    }
    if ((m = /^(<?)==\s+(.+?)\s+(={2,}>|={3,})(?=\s|$|[A-Za-z0-9_])/.exec(rest)) ) {
      return { len: m[0].length, both: !!m[1] && m[3].endsWith('>'), style: 'sync', open: !m[3].endsWith('>'), label: m[2] };
    }
    if ((m = /^(<?)(-\.+-+>?)/.exec(rest))) return { len: m[0].length, both: !!m[1] && m[2].endsWith('>'), style: 'async', open: !m[2].endsWith('>') };
    if ((m = /^(<?)(-{2,}>|-{3,})/.exec(rest))) return { len: m[0].length, both: !!m[1] && m[2].endsWith('>'), style: 'sync', open: !m[2].endsWith('>') };
    if ((m = /^(<?)(={2,}>|={3,})/.exec(rest))) return { len: m[0].length, both: !!m[1] && m[2].endsWith('>'), style: 'sync', open: !m[2].endsWith('>') };
    return null;
  }

  function parseChain(s, line) {
    let i = 0;
    const readGroup = () => {
      const refs = [];
      for (;;) {
        const ref = parseNodeRef(s, i, line);
        if (!ref) return null;
        refs.push(ref); i = ref.end;
        while (s[i] === ' ' || s[i] === '\t') i++;
        if (s[i] === '&' ) { i++; continue; }
        break;
      }
      return refs;
    };
    let prev = readGroup();
    if (!prev) return;
    prev.forEach((r) => applyRef(r, line));
    for (;;) {
      while (s[i] === ' ' || s[i] === '\t') i++;
      if (i >= s.length) return;
      const rest = s.slice(i);
      if (/^[A-Za-z0-9_-]+@(-|=|<)/.test(rest)) { fail(line, 'edge ids ("e1@-->") are not supported; remove the "e1@" part'); return; }
      if (/^(-{2,}|={2,}|-\.+)[xo](\s|$)/.test(rest)) { fail(line, 'arrows ending in x or o ("--x", "--o") are not supported; use -->'); return; }
      const lk = matchLink(rest);
      if (!lk) { fail(line, `cannot read "${rest.slice(0, 24)}"; expected an arrow such as -->, -.->, ==> or --- between nodes`); return; }
      i += lk.len;
      let label = lk.label;
      const pm = /^\s*\|([^|]*)\|/.exec(s.slice(i));
      if (pm) { if (label !== undefined) { fail(line, 'an edge has its label written twice (in the line and in |bars|); keep one'); return; } label = pm[1]; i += pm[0].length; }
      if (lk.open && !openLinkWarned) { openLinkWarned = true; warn(line, '"---" lines have no arrowhead in Mermaid, but motion_arch always draws one; the edge is drawn as an arrow.'); }
      const next = readGroup();
      if (!next) return;
      next.forEach((r) => applyRef(r, line));
      const lab = label !== undefined ? cleanText(label) : '';
      for (const a of prev) for (const b of next) {
        edges.push({ from: a.orig, to: b.orig, label: lab || undefined, style: lk.style, both: lk.both || undefined, line });
      }
      prev = next;
    }
  }

  // ---- header
  let li = 0;
  const L = () => li + 1;
  // front matter
  const firstReal = lines.findIndex((l) => l.trim() !== '');
  if (firstReal >= 0 && lines[firstReal].trim() === '---') {
    let e = -1;
    for (let k = firstReal + 1; k < lines.length; k++) if (lines[k].trim() === '---') { e = k; break; }
    if (e < 0) fail(firstReal + 1, 'front matter starts with "---" but is never closed; add a closing "---" line');
    else {
      for (let k = firstReal + 1; k < e; k++) {
        const m = /^\s*title\s*:\s*(.+?)\s*$/.exec(lines[k]);
        if (m) title = stripQuotes(m[1]);
      }
      li = e + 1;
    }
  }

  for (; li < lines.length; li++) {
    let line = lines[li].trim();
    if (!line) continue;
    if (line.startsWith('%%')) {
      const d = /^%%\s*(title|msg|numbered|pace|duration|step|relation-column|relation-name|rel)\s*:\s*(.*)$/i.exec(line);
      const key = d && d[1].toLowerCase();
      if (key === 'title') { if (d[2].trim()) title = d[2].trim(); }
      else if (key === 'msg') {
        const m = /^(\S+?)\s*->\s*(\S+?)\s+"([^"]*)"(?:\s+(back))?\s*$/.exec(d[2].trim());
        if (!m) fail(L(), `bad "%% msg:" directive; write it as  %% msg: fromId->toId "payload text"  (add the word back at the end for a reply)`);
        else msgDirectives.push({ line: L(), from: m[1], to: m[2], text: m[3], back: !!m[4] });
      } else if (key === 'numbered') {
        const v = d[2].trim().toLowerCase();
        if (v === 'on' || v === 'true' || v === 'yes') numbered = true;
        else if (v === 'off' || v === 'false' || v === 'no') numbered = false;
        else fail(L(), '"%% numbered:" must be on or off');
      } else if (key === 'pace') {
        const v = d[2].trim().toLowerCase();
        if (Object.hasOwn(PACES, v)) pace = v; else fail(L(), `"%% pace:" must be one of ${Object.keys(PACES).join(', ')}`);
      } else if (key === 'duration') {
        const v = Number(d[2].trim().replace(/\s*s$/i, ''));
        if (Number.isFinite(v) && v >= 2 && v <= 120) duration = v; else fail(L(), '"%% duration:" must be a number of seconds from 2 to 120, for example %% duration: 40');
      } else if (key === 'relation-column') {
        const v = d[2].trim().toLowerCase();
        if (v === 'on' || v === 'true' || v === 'yes') relationColumn = true;
        else if (v === 'off' || v === 'false' || v === 'no') relationColumn = false;
        else fail(L(), '"%% relation-column:" must be on or off');
      } else if (key === 'relation-name') {
        const v = d[2].trim();
        if (v && v.length <= LIMITS.relation) relationName = v; else fail(L(), `"%% relation-name:" must be 1 to ${LIMITS.relation} characters, for example %% relation-name: Interaction`);
      } else if (key === 'rel') {
        const m = /^(\S+?)\s*->\s*(\S+?)\s+(.+?)\s*$/.exec(d[2].trim());
        if (!m) fail(L(), 'bad "%% rel:" directive; write it as  %% rel: fromId->toId calls  (free text, at most 20 characters)');
        else if (m[3].length > LIMITS.relation) fail(L(), `"%% rel:" text "${m[3]}" is ${m[3].length} characters; the most is ${LIMITS.relation}`);
        else relDirectives.push({ line: L(), from: m[1], to: m[2], text: m[3] });
      } else if (key === 'step') {
        const m = /^(\S+?)\s*->\s*(\S+?)\s+(\d+)\s*$/.exec(d[2].trim());
        if (!m) fail(L(), 'bad "%% step:" directive; write it as  %% step: fromId->toId 3');
        else stepDirectives.push({ line: L(), from: m[1], to: m[2], step: +m[3] });
      }
      continue;
    }
    line = stripTrailingComment(line);
    if (!headerSeen) {
      const hm = /^(flowchart|graph)(?:-elk)?(?:\s+(LR|RL|TB|TD|BT))?\s*;?$/i.exec(line);
      if (hm) {
        headerSeen = true;
        const d = (hm[2] || 'TB').toUpperCase();
        direction = d === 'TD' ? 'TB' : d;
        continue;
      }
      const word = (/^([A-Za-z][\w-]*)/.exec(line) || [])[1] || line.slice(0, 20);
      const k = word.toLowerCase();
      if (/^(flowchart|graph)/i.test(line)) {
        fail(L(), `cannot read the header "${line}"; write "flowchart LR" (or TD, TB, RL, BT)`);
      } else if (OTHER_DIAGRAMS[k]) {
        fail(L(), `"${word}" diagrams are not supported; only flowcharts are. ${OTHER_DIAGRAMS[k]}`);
      } else if (line.startsWith('%%{')) { continue; }
      else {
        fail(L(), `expected "flowchart LR" (or "graph TD") on the first line, found "${line.slice(0, 30)}"`);
      }
      break;
    }
    for (const stmt of splitStatements(line)) {
      let m;
      if (/^%%\{.*\}%%$/.test(stmt)) continue;
      if ((m = /^subgraph\b\s*(.*)$/.exec(stmt))) {
        let rest = m[1].trim(), key, label;
        let mm;
        if ((mm = /^([A-Za-z0-9_-]+)\s*\[\s*(.*?)\s*\]$/.exec(rest))) { key = mm[1]; label = cleanText(mm[2]); }
        else if ((mm = /^"(.*)"$/.exec(rest))) { label = cleanText(mm[1]); key = slug(label); }
        else if (rest) { label = cleanText(rest); key = rest.includes(' ') ? slug(rest) : rest; }
        else { fail(L(), 'a subgraph needs a name; write: subgraph id[Title]'); key = 'sg' + groupsByKey.size; label = key; }
        const nested = groupStack.length > 0;
        if (nested) {
          warn(L(), `subgraph "${label}" is inside "${groupStack[0].label}"; nested groups are flattened, its nodes are drawn in the outer group "${groupStack[0].label}".`);
        } else if (!groupsByKey.has(key)) {
          groupsByKey.set(key, { key, label, order: groupsByKey.size, line: L() });
        } else {
          warn(L(), `subgraph "${key}" is declared twice; the second block adds to the first.`);
        }
        groupStack.push({ key: nested ? groupStack[0].key : key, label: nested ? groupStack[0].label : label, nested });
        continue;
      }
      if (/^end$/i.test(stmt)) {
        if (!groupStack.length) fail(L(), '"end" without a matching "subgraph"; remove it or add the subgraph line above');
        else groupStack.pop();
        continue;
      }
      if (/^direction\b/i.test(stmt)) { warn(L(), `"${stmt}" inside a subgraph is ignored; the whole diagram uses the direction on the first line.`); continue; }
      if (/^(classDef|style|linkStyle|accTitle|accDescr)\b/.test(stmt)) continue;
      if ((m = /^class\s+([^\s]+)\s+([A-Za-z0-9_-]+)$/.exec(stmt))) { classStmts.push({ line: L(), ids: m[1].split(',').filter(Boolean), cls: m[2] }); continue; }
      if (/^class\b/.test(stmt)) { fail(L(), 'write class statements as: class nodeId kind  (for example: class db store)'); continue; }
      if (/^click\b/.test(stmt)) { warn(L(), 'click/link statements are ignored.'); continue; }
      parseChain(stmt, L());
    }
  }
  if (!headerSeen && !errors.length) fail(1, 'empty input; start with "flowchart LR" and add nodes and arrows');
  if (groupStack.length) fail(lines.length, `${groupStack.length} "subgraph" block(s) are never closed; add an "end" line for each`);

  // class statements -> hints
  for (const cs of classStmts) {
    for (const id of cs.ids) {
      const n = nodes.get(id);
      if (n) n.hints.push(cs.cls);
      else warn(cs.line, `class statement names "${id}", which is not a node` + (didYouMean(id, [...nodes.keys()]) ? ` (did you mean "${didYouMean(id, [...nodes.keys()])}"?)` : '') + '; ignored.');
    }
  }

  if (errors.length) throw new ArchError(errors.slice(0, 20), warnings);

  // ---- build canonical graph
  const mapNode = makeIdMapper();
  const mapGroup = makeIdMapper();
  const groups = [...groupsByKey.values()].sort((a, b) => a.order - b.order);
  const usedGroups = new Set([...nodes.values()].map((n) => n.group).filter((g) => g !== undefined));
  const gOut = [];
  for (const g of groups) {
    if (!usedGroups.has(g.key)) { warn(g.line, `subgraph "${g.label}" has no nodes; it is dropped.`); continue; }
    gOut.push({ id: mapGroup(g.key), label: g.label });
  }
  const nOut = [];
  for (const n of [...nodes.values()].sort((a, b) => a.order - b.order)) {
    let kind;
    for (const h of n.hints) { const k = resolveKind(h); if (k) kind = k; }
    if (!kind) kind = SHAPE_KIND[n.shape || 'plain'];
    const label = n.label !== undefined ? n.label : n.orig;
    const o = { id: mapNode(n.orig), label, kind };
    if (n.sub) o.sub = n.sub;
    if (n.group !== undefined && groupsByKey.has(n.group)) o.group = mapGroup(n.group);
    nOut.push(o);
  }
  const lookup = (k) => (nodes.has(k) ? k : [...nodes.keys()].find((x) => x.toLowerCase() === k.toLowerCase()));
  const eOut = edges.map((e) => {
    const o = { from: mapNode(e.from), to: mapNode(e.to), style: e.style };
    if (e.label) o.label = e.label;
    if (e.both) o.both = true;
    return o;
  });
  // subgraph ids used as edge endpoints would have become nodes; catch that clearly
  for (const e of edges) {
    if (groupsByKey.has(e.from) || groupsByKey.has(e.to)) {
      const which = groupsByKey.has(e.from) ? e.from : e.to;
      const n = nodes.get(which);
      if (n && n.group === undefined && n.label === undefined) {
        errors.push(`line ${e.line}: "${which}" is a subgraph, not a node. Edges to a whole subgraph are not supported; connect to a node inside it.`);
      }
    }
  }
  const mOut = [];
  for (const d of msgDirectives) {
    const f = lookup(d.from), t = lookup(d.to);
    const names = [...nodes.keys()];
    if (!f) { errors.push(`line ${d.line}: message endpoint "${d.from}" is not a node` + (didYouMean(d.from, names) ? ` (did you mean "${didYouMean(d.from, names)}"?)` : '')); continue; }
    if (!t) { errors.push(`line ${d.line}: message endpoint "${d.to}" is not a node` + (didYouMean(d.to, names) ? ` (did you mean "${didYouMean(d.to, names)}"?)` : '')); continue; }
    const m = { from: mapNode(f), to: mapNode(t), text: d.text };
    if (d.back) m.back = true;
    mOut.push(m);
  }
  if (errors.length) throw new ArchError(errors.slice(0, 20), warnings);

  const taken = new Set();
  for (const d of stepDirectives) {
    const f = lookup(d.from), t = lookup(d.to);
    const names = [...nodes.keys()];
    if (!f || !t) { errors.push(`line ${d.line}: step directive names "${!f ? d.from : d.to}", which is not a node` + (didYouMean(!f ? d.from : d.to, names) ? ` (did you mean "${didYouMean(!f ? d.from : d.to, names)}"?)` : '')); continue; }
    const idx = eOut.findIndex((e, i) => e.from === mapNode(f) && e.to === mapNode(t) && !taken.has(i));
    if (idx < 0) { errors.push(`line ${d.line}: step directive: there is no (further) edge from "${d.from}" to "${d.to}"`); continue; }
    taken.add(idx); eOut[idx].step = d.step;
  }
  const relTaken = new Set();
  for (const d of relDirectives) {
    const f = lookup(d.from), t = lookup(d.to);
    const names = [...nodes.keys()];
    if (!f || !t) { errors.push(`line ${d.line}: rel directive names "${!f ? d.from : d.to}", which is not a node` + (didYouMean(!f ? d.from : d.to, names) ? ` (did you mean "${didYouMean(!f ? d.from : d.to, names)}"?)` : '')); continue; }
    const idx = eOut.findIndex((e, i) => e.from === mapNode(f) && e.to === mapNode(t) && !relTaken.has(i));
    if (idx < 0) { errors.push(`line ${d.line}: rel directive: there is no (further) edge from "${d.from}" to "${d.to}"`); continue; }
    relTaken.add(idx); eOut[idx].relation = d.text;
  }
  if (errors.length) throw new ArchError(errors.slice(0, 20), warnings);
  const graph = { direction: opts.direction || direction, groups: gOut, nodes: nOut, edges: eOut, messages: mOut };
  if (relationColumn !== undefined) graph.relationColumn = relationColumn;
  if (relationName) graph.relationName = relationName;
  if (numbered !== undefined) graph.numbered = numbered;
  if (pace) graph.pace = pace;
  if (duration !== undefined) graph.duration = duration;
  const ttl = opts.title || title;
  if (ttl) graph.title = ttl;
  return { graph, warnings };
}

// ---- route.mjs
// Orthogonal edge router and edge-label placement for the converter. Pure ES module, deterministic.
//
// The atom stays dumb: it draws each edge's `points` as a polyline with rounded corners and puts the label where
// `label_at` says. Everything clever is here.
//
//   routeEdges(graph, layout, opts) -> {routes, warnings, metrics}
//     routes[i] = {points: [[x, y], ...] (rim to rim, axis-aligned), label: {x, y, w, h} | null, via: 'grid' | 'curve'}
//
// How an edge is routed: a uniform grid (cell = about 0.55 x the text size) is laid over the drawing. Cells close to
// a node box, or on a group title, are blocked. Each edge is an A* search over (cell, heading) with a cost for
// distance, for every bend, for every cell another edge already uses (a heavy cost if it runs along that edge, a
// medium one if it crosses it), for cells inside a group the edge does not belong to, and for running along a group
// border. Edges are routed shortest first in input order, so the result is byte-stable. An edge leaves and enters a
// box at a port: a cell in the band 14 px beyond one of its four sides, so the first and last stretch always run at
// a right angle to the box and are long enough for the arrowhead. Parallel edges take neighbouring lanes because an
// occupied lane is expensive; a request/response pair therefore comes out as two lanes side by side.
//
// (opts.chips, an optional {edgeIndex: chip text length}, keeps an edge's own label out of its chips' path; the converter does not use it,
// because the atom draws a routed edge's label above the chips.)
// Labels go on the longest free straight stretch: candidates sit above or below a horizontal stretch, left or right
// of a vertical one, or on the line, and are checked against every box, group title, other label and other edge.
// A label is never shortened here; if nothing is free it is placed where it collides least and a warning says so.

const E = 0, S = 1, W = 2, N = 3;
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];

class Heap {
  constructor() { this.a = []; this.n = 0; }
  push(f, id, term, port) {
    const it = { f, id, term, port, k: this.n++ };
    const a = this.a;
    a.push(it);
    let i = a.length - 1;
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (this.lt(a[i], a[p])) { [a[i], a[p]] = [a[p], a[i]]; i = p; } else break;
    }
  }
  lt(x, y) { return x.f < y.f - 1e-9 || (Math.abs(x.f - y.f) <= 1e-9 && x.k < y.k); }
  pop() {
    const a = this.a;
    const top = a[0], last = a.pop();
    if (a.length) {
      a[0] = last;
      let i = 0;
      for (;;) {
        const l = 2 * i + 1, r = l + 1;
        let m = i;
        if (l < a.length && this.lt(a[l], a[m])) m = l;
        if (r < a.length && this.lt(a[r], a[m])) m = r;
        if (m === i) break;
        [a[i], a[m]] = [a[m], a[i]]; i = m;
      }
    }
    return top;
  }
  get size() { return this.a.length; }
}

const rectsOverlap = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
const inflate = (r, m) => ({ x: r.x - m, y: r.y - m, w: r.w + 2 * m, h: r.h + 2 * m });

function groupTitleRect(g, gl, s) {
  return { x: g.x + 12, y: g.y + 6, w: groupLabelWidth(gl.label, s) - 20, h: 24 };
}

// does the axis-aligned segment a-b pass through the open interior of rect r (shrunk by `m`)?
function segHitsRect(a, b, r, m = 0) {
  const x0 = Math.min(a[0], b[0]), x1 = Math.max(a[0], b[0]), y0 = Math.min(a[1], b[1]), y1 = Math.max(a[1], b[1]);
  return x1 > r.x + m && x0 < r.x + r.w - m && y1 > r.y + m && y0 < r.y + r.h - m;
}
// proper crossing of two axis-aligned segments (perpendicular, interiors meet)
function axisCross(a1, a2, b1, b2) {
  const ah = a1[1] === a2[1], bh = b1[1] === b2[1];
  if (ah === bh) return false;
  const [h1, h2, v1, v2] = ah ? [a1, a2, b1, b2] : [b1, b2, a1, a2];
  const hx0 = Math.min(h1[0], h2[0]), hx1 = Math.max(h1[0], h2[0]), vy0 = Math.min(v1[1], v2[1]), vy1 = Math.max(v1[1], v2[1]);
  return v1[0] > hx0 + 0.5 && v1[0] < hx1 - 0.5 && h1[1] > vy0 + 0.5 && h1[1] < vy1 - 0.5;
}

// proper crossing of two general segments (used for sampled curves)
function diagCross(a, b, c, d) {
  if (a[0] === b[0] || a[1] === b[1] || c[0] === d[0] || c[1] === d[1]) return false;
  const o = (p, q, r) => (q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]);
  return o(c, d, a) * o(c, d, b) < 0 && o(a, b, c) * o(a, b, d) < 0;
}

function routeEdges(graph, layout, opts = {}) {
  const s = layout.s;
  const warnings = [];
  const g = Math.max(8, Math.round(0.55 * s));            // lane pitch
  const clear = Math.max(6, Math.round(0.42 * s));        // keep-out around every box
  const port0 = Math.max(clear + 3, 15);                  // first port ring distance from the rim
  const nodeById = new Map(layout.nodes.map((n) => [n.id, n]));
  const boxes = layout.nodes;
  const glabels = layout.groups.map((gr) => groupTitleRect(gr, graph.groups.find((x) => x.id === gr.id), s));
  // ---- the grid covers all content plus a few lanes of margin on every side
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const r of [...boxes, ...layout.groups]) { x0 = Math.min(x0, r.x); y0 = Math.min(y0, r.y); x1 = Math.max(x1, r.x + r.w); y1 = Math.max(y1, r.y + r.h); }
  if (!isFinite(x0)) { x0 = y0 = 0; x1 = y1 = 100; }
  const pad = 5 * g;
  const ox = x0 - pad, oy = y0 - pad;
  const cols = Math.ceil((x1 - x0 + 2 * pad) / g), rows = Math.ceil((y1 - y0 + 2 * pad) / g);
  const NC = cols * rows;
  const cx = (i) => ox + (i + 0.5) * g, cy = (j) => oy + (j + 0.5) * g;
  const ci = (x) => Math.floor((x - ox) / g), cj = (y) => Math.floor((y - oy) / g);
  const blocked = new Uint8Array(NC);
  const fillRect = (r, m, arr, val = 1) => {
    const i0 = Math.max(0, ci(r.x - m)), i1 = Math.min(cols - 1, ci(r.x + r.w + m)), j0 = Math.max(0, cj(r.y - m)), j1 = Math.min(rows - 1, cj(r.y + r.h + m));
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const px = cx(i), py = cy(j);
      if (px > r.x - m && px < r.x + r.w + m && py > r.y - m && py < r.y + r.h + m) arr[j * cols + i] = val;
    }
  };
  for (const b of boxes) fillRect(b, clear, blocked);
  for (const t of glabels) fillRect(t, 3, blocked);
  // group membership per cell, and cells that lie on a group border
  const cellGroup = new Int8Array(NC).fill(-1);
  layout.groups.forEach((gr, k) => fillRect(gr, 0, cellGroup, k));
  const hBorder = new Uint8Array(NC), vBorder = new Uint8Array(NC);
  layout.groups.forEach((gr) => {
    for (let i = 0; i < cols; i++) for (const yy of [gr.y, gr.y + gr.h]) {
      const j = cj(yy), px = cx(i);
      if (px >= gr.x - g && px <= gr.x + gr.w + g && j >= 0 && j < rows && Math.abs(cy(j) - yy) <= 0.6 * g) hBorder[j * cols + i] = 1;
    }
    for (let j = 0; j < rows; j++) for (const xx of [gr.x, gr.x + gr.w]) {
      const i = ci(xx), py = cy(j);
      if (py >= gr.y - g && py <= gr.y + gr.h + g && i >= 0 && i < cols && Math.abs(cx(i) - xx) <= 0.6 * g) vBorder[j * cols + i] = 1;
    }
  });
  const groupIdx = new Map(layout.groups.map((gr, k) => [gr.id, k]));
  const groupOfNode = new Map(graph.nodes.map((n) => [n.id, n.group && groupIdx.has(n.group) ? groupIdx.get(n.group) : -1]));
  // near a box (not blocked): a small cost keeps lanes in the middle of a channel
  const near = new Uint8Array(NC);
  for (const b of boxes) fillRect(b, clear + 1.5 * g, near);

  const usedH = new Uint8Array(NC), usedV = new Uint8Array(NC);
  const scale = opts.bendScale || 1;
  const BEND = 34 * scale, OVERLAP = 420, CROSS = 70, FOREIGN = 14, OWN_OUT = 7, BORDER = 12, NEAR = 3.5, SIDE = 0.18;

  // ports of a box: cells in the band [port0, port0 + g) beyond a side, away from the rounded corners
  const ports = (b) => {
    const out = [];
    const cm = 14;
    const sides = [
      { dir: E, ok: (px, py) => px >= b.x + b.w + port0 && px < b.x + b.w + port0 + g && py > b.y + cm && py < b.y + b.h - cm, off: (px, py) => Math.abs(py - (b.y + b.h / 2)) },
      { dir: W, ok: (px, py) => px <= b.x - port0 && px > b.x - port0 - g && py > b.y + cm && py < b.y + b.h - cm, off: (px, py) => Math.abs(py - (b.y + b.h / 2)) },
      { dir: S, ok: (px, py) => py >= b.y + b.h + port0 && py < b.y + b.h + port0 + g && px > b.x + cm && px < b.x + b.w - cm, off: (px) => Math.abs(px - (b.x + b.w / 2)) },
      { dir: N, ok: (px, py) => py <= b.y - port0 && py > b.y - port0 - g && px > b.x + cm && px < b.x + b.w - cm, off: (px) => Math.abs(px - (b.x + b.w / 2)) },
    ];
    const i0 = Math.max(0, ci(b.x - port0 - g)), i1 = Math.min(cols - 1, ci(b.x + b.w + port0 + g)), j0 = Math.max(0, cj(b.y - port0 - g)), j1 = Math.min(rows - 1, cj(b.y + b.h + port0 + g));
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      if (blocked[j * cols + i]) continue;
      const px = cx(i), py = cy(j);
      for (const sd of sides) if (sd.ok(px, py)) out.push({ cell: j * cols + i, i, j, out: sd.dir, side: sd.off(px, py) * SIDE });
    }
    return out;
  };

  const route = (e, k, scl) => {
    const fb = nodeById.get(e.from), tb = nodeById.get(e.to);
    const sg = groupOfNode.get(e.from), tg = groupOfNode.get(e.to);
    const cellCost = (c, axisH) => {
      let k2 = 0;
      if (axisH ? usedH[c] : usedV[c]) k2 += OVERLAP;
      if (axisH ? usedV[c] : usedH[c]) k2 += CROSS;
      const cg = cellGroup[c];
      if (cg >= 0 && cg !== sg && cg !== tg) k2 += FOREIGN;
      else if (cg < 0 && sg >= 0 && sg === tg) k2 += OWN_OUT;
      if (axisH ? hBorder[c] : vBorder[c]) k2 += BORDER;
      if (near[c]) k2 += NEAR;
      return k2;
    };
    const dist = new Float64Array(NC * 4).fill(Infinity);
    const prev = new Int32Array(NC * 4).fill(-1);
    const heap = new Heap();
    const tPorts = ports(tb), tMap = new Map();
    for (const p of tPorts) tMap.set(p.cell, [...(tMap.get(p.cell) || []), p]);
    const hTarget = (i, j) => {
      const px = cx(i), py = cy(j);
      return Math.abs(Math.max(tb.x - px, 0, px - (tb.x + tb.w))) + Math.abs(Math.max(tb.y - py, 0, py - (tb.y + tb.h)));
    };
    for (const p of ports(fb)) {
      const id = p.cell * 4 + p.out;
      const c0 = p.side + cellCost(p.cell, p.out === E || p.out === W);
      if (c0 < dist[id]) { dist[id] = c0; prev[id] = -2 - p.out; heap.push(c0 + hTarget(p.i, p.j), id, false); }
    }
    let end = -1, endCost = Infinity, endPort = null;
    while (heap.size) {
      const it = heap.pop();
      if (it.term) { end = it.id; endCost = it.f; endPort = it.port; break; }
      const id = it.id, cell = id >> 2, dir = id & 3;
      const gcost = dist[id];
      if (it.f > gcost + hTarget(cell % cols, (cell / cols) | 0) + 1e-6) continue;
      const i = cell % cols, j = (cell / cols) | 0;
      const tp = tMap.get(cell);
      if (tp) for (const p of tp) {
        const inward = (p.out + 2) & 3;
        heap.push(gcost + p.side + (dir === inward ? 0 : BEND * scl), id, true, p);
      }
      for (const nd of [dir, (dir + 1) & 3, (dir + 3) & 3]) {
        const ni = i + DX[nd], nj = j + DY[nd];
        if (ni < 0 || nj < 0 || ni >= cols || nj >= rows) continue;
        const nc = nj * cols + ni;
        if (blocked[nc]) continue;
        const cost = gcost + g + (nd === dir ? 0 : BEND * scl) + cellCost(nc, nd === E || nd === W);
        const nid = nc * 4 + nd;
        if (cost < dist[nid] - 1e-9) { dist[nid] = cost; prev[nid] = id; heap.push(cost + hTarget(ni, nj), nid, false); }
      }
    }
    if (end < 0) return null;
    // rebuild the cell path
    const cells = [];
    let id = end;
    while (id >= 0) { cells.push([id >> 2, id & 3]); id = prev[id]; }
    const startDir = -2 - id;
    cells.reverse();
    const pts = [];
    const first = cells[0][0];
    const fi = first % cols, fj = (first / cols) | 0;
    // rim point of the source
    pts.push(startDir === E ? [fb.x + fb.w, cy(fj)] : startDir === W ? [fb.x, cy(fj)] : startDir === S ? [cx(fi), fb.y + fb.h] : [cx(fi), fb.y]);
    for (const [c] of cells) pts.push([cx(c % cols), cy((c / cols) | 0)]);
    const pin = (endPort.out + 2) & 3;
    const lastC = cells[cells.length - 1][0], li = lastC % cols, lj = (lastC / cols) | 0;
    pts.push(endPort.out === E ? [tb.x + tb.w, cy(lj)] : endPort.out === W ? [tb.x, cy(lj)] : endPort.out === S ? [cx(li), tb.y + tb.h] : [cx(li), tb.y]);
    void pin;
    // drop collinear points
    const out = [pts[0]];
    for (let q = 1; q < pts.length - 1; q++) {
      const a = out[out.length - 1], b = pts[q], c = pts[q + 1];
      if ((a[0] === b[0] && b[0] === c[0]) || (a[1] === b[1] && b[1] === c[1])) continue;
      out.push(b);
    }
    out.push(pts[pts.length - 1]);
    return { points: out, cells: cells.map((c) => c[0]), cost: endCost };
  };

  const order = graph.edges.map((e, i) => i).sort((a, b) => {
    const ea = graph.edges[a], eb = graph.edges[b];
    const da = Math.abs(nodeById.get(ea.from).x - nodeById.get(ea.to).x) + Math.abs(nodeById.get(ea.from).y - nodeById.get(ea.to).y);
    const db = Math.abs(nodeById.get(eb.from).x - nodeById.get(eb.to).x) + Math.abs(nodeById.get(eb.from).y - nodeById.get(eb.to).y);
    return da - db || a - b;
  });
  const routes = new Array(graph.edges.length).fill(null);
  for (const k of order) {
    const e = graph.edges[k];
    if (!nodeById.has(e.from) || !nodeById.has(e.to) || e.from === e.to) continue;
    let r = null;
    for (const scl of [1, 3, 8]) {
      r = route(e, k, scl);
      if (r && r.points.length <= 10) break;
      if (r && scl === 8) r = null;
    }
    if (!r) { warnings.push(`edge ${k + 1} (${e.from} -> ${e.to}): no clear orthogonal route was found, so it is drawn as a curve.`); continue; }
    // occupy the lanes this edge uses (a cell is entered along an axis; the corner cell counts for both)
    const cs = r.cells;
    for (let q = 0; q < cs.length; q++) {
      const c = cs[q], pc = q ? cs[q - 1] : c, nc2 = q + 1 < cs.length ? cs[q + 1] : c;
      const horiz = (a, b) => ((a / cols) | 0) === ((b / cols) | 0), vert = (a, b) => a % cols === b % cols;

// ---------------------------------------------------------------- labels

function placeLabels(graph, layout, routes, glabels, s, warnings, chips = {}) {

      const before = new Map(L[r].map((v, i) => [v, i]));
      L[r].sort((a, b) => key.get(a) - key.get(b) || before.get(a) - before.get(b));

      L[r].forEach((v, i) => { f[v] = (i + 0.5) / L[r].length; });
    }
    const c = crossings();
    if (c < bestC) { bestC = c; best = L.map((l) => l.slice()); }
  }
  L = best;
  // 4. coordinates
  const lane = Math.round(0.8 * s);
  const ext = (v) => (v >= n ? { r: 0, c: lane } : axis === 'x' ? { r: items[v].w, c: items[v].h } : { r: items[v].h, c: items[v].w });
  const thick = L.map((layer) => Math.max(0, ...layer.map((v) => ext(v).r)));
  const gaps = [];
  for (let r = 0; r + 1 < R; r++) {
    let g = axis === 'x' ? 2.7 * s : 3.0 * s;
    for (const e of Eorig) {
      const lo = Math.min(rank[e.oa], rank[e.ob]), hi = Math.max(rank[e.oa], rank[e.ob]);
      if (lo === r && hi === r + 1) g = Math.max(g, axis === 'x' ? e.lw + 1.6 * s : e.lh + 1.4 * s);
    }
    if (laneGap) {
      // orthogonal routing: every edge that runs through this channel takes its own lane
      const through = Eorig.filter((e) => Math.min(rank[e.oa], rank[e.ob]) <= r && Math.max(rank[e.oa], rank[e.ob]) >= r + 1).reduce((a, e) => a + e.n, 0);
      g += Math.max(0, through - 1) * laneGap;
      if (axis === 'y') {

        const lh = Eorig.filter((e) => Math.min(rank[e.oa], rank[e.ob]) <= r && Math.max(rank[e.oa], rank[e.ob]) >= r + 1 && e.lh).reduce((a, e) => a + e.lh + 4, 0);

  for (let r = 0; r < R; r++) { rankPos.push(acc); acc += thick[r] + (gaps[r] || 0); }
  const crossGap = Math.round(1.3 * s) + (laneGap ? Math.round(0.9 * s) : 0);
  const cpos = Array(N).fill(0);
  L.forEach((layer) => {
    let t = 0;
    layer.forEach((v) => { cpos[v] = t + ext(v).c / 2; t += ext(v).c + crossGap; });
    const total = t - crossGap;
    layer.forEach((v) => { cpos[v] -= total / 2; });
  });
  for (let pass = 0; pass < 8; pass++) {
    const down = pass % 2 === 0;
    const order = down ? [...L.keys()] : [...L.keys()].reverse();
    for (const r of order) {
      const layer = L[r];
      const desired = layer.map((v) => {
        const ns = nbr[v];
        return ns.length ? ns.reduce((a, w) => a + cpos[w], 0) / ns.length : cpos[v];
      });
      const md = layer.slice(1).map((v, i) => (ext(layer[i]).c + ext(v).c) / 2 + crossGap);
      const placed = spaceOut(desired, md);
      layer.forEach((v, i) => { cpos[v] = placed[i]; });
