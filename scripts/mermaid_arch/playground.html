  }
  let lo = Infinity, hi = -Infinity;
  for (let v = 0; v < n; v++) { lo = Math.min(lo, cpos[v] - ext(v).c / 2); hi = Math.max(hi, cpos[v] + ext(v).c / 2); }
  if (!n) { lo = 0; hi = 0; }
  const pos = new Map(), rk = new Map();
  for (let v = 0; v < n; v++) {
    const rc = rankPos[rank[v]] + thick[rank[v]] / 2;      // rank-axis centre
    const cc = cpos[v] - lo;                                  // cross-axis centre
    const cx = axis === 'x' ? rc : cc, cy = axis === 'x' ? cc : rc;
    pos.set(items[v].key, { x: cx - items[v].w / 2, y: cy - items[v].h / 2 });
    rk.set(items[v].key, rank[v]);
  }
  const mainLen = acc;
  const crossLen = hi - lo;
  return { pos, rank: rk, w: Math.round(axis === 'x' ? mainLen : crossLen), h: Math.round(axis === 'x' ? crossLen : mainLen) };
}

// ---------------------------------------------------------------- compound layout
function otherAxis(a) { return a === 'x' ? 'y' : 'x'; }

// graph: validated canonical graph; flows: Map groupId -> 'same'|'cross'
// labelled request/response pairs (a->b and b->a, both labelled): returns [[a,b],...] over keys
function labelledPairs(edges, keyOf) {
  const out = [], seen = new Set();
  for (const e of edges) {
    if (!e.label) continue;
    const a = keyOf(e.from), b = keyOf(e.to);
    if (a === b) continue;
    const k = a < b ? a + '|' + b : b + '|' + a;
    if (seen.has(k)) continue;
    if (edges.some((f) => f.label && keyOf(f.from) === b && keyOf(f.to) === a)) { seen.add(k); out.push([a, b]); }
  }
  return out;
}

function clusterLayout(graph, s, flows, pairMode = false, laneGap = 0, extraGap = 0) {
  const outerAxis = graph.direction === 'LR' || graph.direction === 'RL' ? 'x' : 'y';
  const nodeById = new Map(graph.nodes.map((n) => [n.id, n]));
  const box = new Map(graph.nodes.map((n) => [n.id, nodeBox(n, s)]));
  const edgeOf = (e) => {
    const lab = e.label ? edgeLabelSize(e.label, s) : { w: 0, h: 0 };
    return { a: e.from, b: e.to, lw: lab.w, lh: lab.h };
  };
  const padX = Math.round(1.1 * s), padBottom = Math.round(1.0 * s);
  const padTop = Math.round(24 + 0.3 * (s - 5) + 11);
  const clusters = [];            // top-level items
  const clusterOfNode = new Map();
  const inner = new Map();        // clusterKey -> {layout, items}
  const groupOrder = graph.groups.map((g) => g.id);
  // clusters ordered by first member's input position (stable)
  const firstSeen = new Map();
  graph.nodes.forEach((n, i) => { const k = n.group ? 'g:' + n.group : 'n:' + n.id; if (!firstSeen.has(k)) firstSeen.set(k, i); });
  const keys = [...firstSeen.keys()];
  for (const k of keys) {
    if (k.startsWith('n:')) {
      const id = k.slice(2), b = box.get(id);
      clusters.push({ key: k, w: b.w, h: b.h, members: [id] });
      clusterOfNode.set(id, k);
    } else {
      const gid = k.slice(2);
      const members = graph.nodes.filter((n) => n.group === gid).map((n) => n.id);
      const flow = flows.get(gid) === 'cross' ? otherAxis(outerAxis) : outerAxis;
      const items = members.map((id) => ({ key: id, ...box.get(id) }));
      const innerEdges = graph.edges.filter((e) => members.includes(e.from) && members.includes(e.to)).map(edgeOf);
      const innerPairs = pairMode && flow === 'y' ? labelledPairs(graph.edges.filter((e) => members.includes(e.from) && members.includes(e.to)), (x) => x) : [];
      const lay = layered(items, innerEdges, flow, s, innerPairs, laneGap, extraGap);
      const gl = graph.groups.find((g) => g.id === gid);
      const w = Math.max(lay.w + 2 * padX, groupLabelWidth(gl.label, s));
      const h = lay.h + padTop + padBottom;
      inner.set(k, { lay, w, h, gid, offX: Math.round((w - lay.w) / 2), offY: padTop });
      clusters.push({ key: k, w, h, members });
      members.forEach((m) => clusterOfNode.set(m, k));
    }
  }
  // cluster-level edges (deduplicated, inter-cluster only)
  const ce = new Map();
  for (const e of graph.edges) {
    const a = clusterOfNode.get(e.from), b = clusterOfNode.get(e.to);
    if (a === b) continue;
    const k = a + '>' + b;
    const o = edgeOf(e);
    const prev = ce.get(k);
    if (prev) { prev.lw = Math.max(prev.lw, o.lw); prev.lh = Math.max(prev.lh, o.lh); prev.n++; } else ce.set(k, { a, b, lw: o.lw, lh: o.lh, n: 1 });
  }
  const topPairs = pairMode && outerAxis === 'y' ? labelledPairs(graph.edges, (x) => clusterOfNode.get(x)) : [];
  const top = layered(clusters, [...ce.values()], outerAxis, s, topPairs, laneGap, extraGap);
  const nodes = [], groups = [];
  for (const c of clusters) {
    const p = top.pos.get(c.key);
    const inn = inner.get(c.key);
    if (!inn) { const id = c.members[0]; nodes.push({ id, x: p.x, y: p.y, w: c.w, h: c.h }); continue; }
    groups.push({ id: inn.gid, x: p.x, y: p.y, w: c.w, h: c.h });
    for (const id of c.members) {
      const q = inn.lay.pos.get(id), b = box.get(id);
      nodes.push({ id, x: p.x + inn.offX + q.x, y: p.y + inn.offY + q.y, w: b.w, h: b.h });
    }
  }
  const order = new Map(graph.nodes.map((n, i) => [n.id, i]));
  nodes.sort((a, b) => order.get(a.id) - order.get(b.id));
  groups.sort((a, b) => groupOrder.indexOf(a.id) - groupOrder.indexOf(b.id));
  // mirror for RL / BT
  const W = top.w, H = top.h;
  if (graph.direction === 'RL') { nodes.forEach((n) => { n.x = W - n.x - n.w; }); groups.forEach((g) => { g.x = W - g.x - g.w; }); }
  if (graph.direction === 'BT') { nodes.forEach((n) => { n.y = H - n.y - n.h; }); groups.forEach((g) => { g.y = H - g.y - g.h; }); }
  return { nodes, groups, w: W, h: H, s };
}

// ---------------------------------------------------------------- geometry shared with the renderer
function rim(b, dx, dy) {
  const hw = b.w / 2, hh = b.h / 2;
  const t = Math.min(dx === 0 ? 1e9 : hw / Math.abs(dx), dy === 0 ? 1e9 : hh / Math.abs(dy));
  return [b.cx + dx * t, b.cy + dy * t];
}
// the atom's quadratic curve for an edge (renderers/web_article.py, _render_motion_arch)
function edgeCurve(fb, tb, curve) {
  const dx = tb.cx - fb.cx, dy = tb.cy - fb.cy;
  const ln = Math.sqrt(dx * dx + dy * dy) || 1;
  const bend = curve / 100;
  const a = rim(fb, dx, dy), z = rim(tb, -dx, -dy);
  const mx = (a[0] + z[0]) / 2, my = (a[1] + z[1]) / 2;
  const c = [mx - (dy / ln) * bend * ln * 0.5, my + (dx / ln) * bend * ln * 0.5];
  return [a, c, z];
}
const quad = (P, t) => [(1 - t) * (1 - t) * P[0][0] + 2 * (1 - t) * t * P[1][0] + t * t * P[2][0], (1 - t) * (1 - t) * P[0][1] + 2 * (1 - t) * t * P[1][1] + t * t * P[2][1]];
function labelRect(P, text, s) {
  const sz = edgeLabelSize(text, s);
  const lx = 0.25 * P[0][0] + 0.5 * P[1][0] + 0.25 * P[2][0];
  const ly = 0.25 * P[0][1] + 0.5 * P[1][1] + 0.25 * P[2][1] - 10;
  const fs = s - 4;
  return { x: lx - sz.w / 2, y: ly - fs * 0.85 - 2, w: sz.w, h: sz.h };
}
const overlap = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
const inside = (p, b, m = 0) => p[0] > b.x - m && p[0] < b.x + b.w + m && p[1] > b.y - m && p[1] < b.y + b.h + m;

function segCross(p1, p2, p3, p4) {
  const d = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
  const d1 = d(p3, p4, p1), d2 = d(p3, p4, p2), d3 = d(p1, p2, p3), d4 = d(p1, p2, p4);
  return d1 * d2 < 0 && d3 * d4 < 0;
}

function asBoxes(layout) {
  const m = new Map();
  for (const n of layout.nodes) m.set(n.id, { ...n, cx: n.x + n.w / 2, cy: n.y + n.h / 2 });
  return m;
}

// ---------------------------------------------------------------- the curve step (replaceable router)
// Picks an integer `curve` (-100..100) for each edge so that, as far as the atom's
// one-bend curve allows, edges do not cross other boxes, edge labels do not sit on
// boxes or on each other, and two edges between the same pair do not coincide.
function routeCurves(graph, layout) {
  const s = layout.s;
  const boxes = asBoxes(layout);
  const list = [...boxes.values()];
  const cands = [0, 12, -12, 24, -24, 36, -36, 50, -50, 65, -65, 80, -80, 100, -100];
  const glabels = layout.groups.map((g) => {
    const gl = graph.groups.find((x) => x.id === g.id);
    return { x: g.x + 12, y: g.y + 6, w: groupLabelWidth(gl.label, s) - 20, h: 24 };
  });
  const chosen = [];                 // {P, rect}
  const curves = [];
  graph.edges.forEach((e, i) => {
    const fb = boxes.get(e.from), tb = boxes.get(e.to);
    let bestC = 0, bestCost = Infinity, bestGeo = null;
    for (const c of cands) {
      const P = edgeCurve(fb, tb, c);
      let cost = Math.abs(c) * 0.04;
      // samples against third-party boxes
      for (let k = 1; k < 24; k++) {
        const pt = quad(P, k / 24);
        for (const b of list) {
          if (b === fb || b === tb) continue;
          if (inside(pt, { x: b.x, y: b.y, w: b.w, h: b.h }, 3)) cost += 6;
        }
      }
      // endpoint boxes: a curve that bows back through its own end boxes
      for (let k = 2; k < 22; k++) {
        const pt = quad(P, k / 24);
        if (inside(pt, fb, -1) || inside(pt, tb, -1)) cost += 2;
      }
      let rect = null;
      if (e.label) {
        rect = labelRect(P, e.label, s);
        for (const b of list) if (overlap(rect, { x: b.x - 2, y: b.y - 2, w: b.w + 4, h: b.h + 4 })) cost += 40;
        for (const gl of glabels) if (overlap(rect, gl)) cost += 25;
        for (const o of chosen) if (o.rect && overlap(rect, o.rect)) cost += 30;
        for (const o of chosen) for (let k = 1; k < 8; k++) { const pt = quad(o.P, k / 8); if (inside(pt, rect, 2)) cost += 3; }
      }
      // do not lie on top of an earlier edge
      for (const o of chosen) {
        let close = 0;
        for (let k = 2; k <= 10; k += 2) { const a = quad(P, k / 12), b = quad(o.P, k / 12); if (Math.hypot(a[0] - b[0], a[1] - b[1]) < 18) close++; }
        if (close >= 2) cost += 12 * close;
        if (segCross(P[0], P[2], o.P[0], o.P[2])) cost += 1.5;
      }
      if (cost < bestCost - 1e-9) { bestCost = cost; bestC = c; bestGeo = { P, rect }; }
    }
    curves[i] = bestC;
    chosen.push(bestGeo);
  });
  return curves;
}

// ---------------------------------------------------------------- quality metrics
function measure(graph, layout, curves) {
  const boxes = asBoxes(layout);
  const list = [...boxes.values()];
  let crossings = 0, throughBoxes = 0, labelsOnBoxes = 0, labelOverlaps = 0, len = 0;
  const rects = [];
  const geo = graph.edges.map((e, i) => edgeCurve(boxes.get(e.from), boxes.get(e.to), curves ? curves[i] : 0));
  geo.forEach((P, i) => {
    len += Math.hypot(P[2][0] - P[0][0], P[2][1] - P[0][1]);
    const e = graph.edges[i];
    for (const b of list) {
      if (b.id === e.from || b.id === e.to) continue;
      let hit = false;
      for (let k = 1; k < 24; k++) if (inside(quad(P, k / 24), b, 0)) hit = true;
      if (hit) throughBoxes++;
    }
    if (e.label) {
      const r = labelRect(P, e.label, layout.s);
      if (list.some((b) => overlap(r, b))) labelsOnBoxes++;
      for (const o of rects) if (overlap(r, o)) labelOverlaps++;
      rects.push(r);
    }
    for (let j = i + 1; j < geo.length; j++) {
      const f = graph.edges[j];
      if (f.from === e.from || f.from === e.to || f.to === e.from || f.to === e.to) continue;
      if (segCross(P[0], P[2], geo[j][0], geo[j][2])) crossings++;
    }
  });
  return { crossings, throughBoxes, labelsOnBoxes, labelOverlaps, edgeLength: Math.round(len) };
}

// ---------------------------------------------------------------- orientation search
function score(graph, layout, curves, fit) {
  const m = measure(graph, layout, curves);
  const s = layout.s;
  const wu = layout.w / s, hu = layout.h / s;
  const wW = fit === 'wide' ? 0.35 : 1.5, hW = 0.35;
  return wu * wW + hu * hW + m.crossings * 7 + m.throughBoxes * 12 + m.labelsOnBoxes * 10 + m.labelOverlaps * 40 + (m.edgeLength / s) * 0.06;
}

// text px on a 343 px column for a drawing of this size: the smallest text is size - 4 (edge labels)
const phonePx = (w, s) => ((s - 4) * 343) / Math.max(w, 1);
// a quick shape score used to pick which layouts are worth routing: legible on a phone, not absurdly tall, short edges
function shapeScore(graph, layout, fit) {
  const s = layout.s, W = layout.w, H = layout.h;
  const byId = new Map(layout.nodes.map((n) => [n.id, n]));
  let len = 0;
  for (const e of graph.edges) { const a = byId.get(e.from), b = byId.get(e.to); if (a && b) len += Math.abs(a.x + a.w / 2 - b.x - b.w / 2) + Math.abs(a.y + a.h / 2 - b.y - b.h / 2); }
  const phone = fit === 'wide' ? 0 : 24 * Math.max(0, 9 - phonePx(W, s)) + 40 * Math.max(0, H / W - 1.3);
  return phone + (W / s) * 0.15 + (H / s) * 0.15 + (len / s) * 0.35;
}

function chooseLayout(graph, s, fit = 'balanced') {
  return rankLayouts(graph, s, fit, 1, 0)[0];
}

// All candidate layouts (cluster flow directions x request/response pairing), best first by the cheap curve score.
function rankLayouts(graph, s, fit = 'balanced', keep = 3, laneGap = 0, shapeOnly = false, extraGap = 0) {
  const multi = graph.groups.filter((g) => graph.nodes.filter((n) => n.group === g.id).length >= 2).map((g) => g.id);
  const list = [];
  const total = 1 << multi.length;
  for (let mask = 0; mask < total; mask++) {
    for (const pairMode of [false, true]) {
      const flows = new Map(multi.map((id, i) => [id, mask & (1 << i) ? 'cross' : 'same']));
      const lay = clusterLayout(graph, s, flows, pairMode, laneGap, extraGap);
      if (shapeOnly) { list.push({ layout: lay, curves: null, score: shapeScore(graph, lay, fit), flows, pairMode }); continue; }
      const curves = routeCurves(graph, lay);
      list.push({ layout: lay, curves, score: score(graph, lay, curves, fit), flows, pairMode });
    }
  }
  return list.map((v, i) => ({ v, i })).sort((a, b) => (Math.abs(a.v.score - b.v.score) < 1e-9 ? a.i - b.i : a.v.score - b.v.score)).slice(0, keep).map((x) => x.v);
}

// ---------------------------------------------------------------- framing: size choice and viewBox
function layoutGraph(graph, opts = {}) {
  return opts.routing === 'curve' ? layoutCurve(graph, opts) : layoutOrthogonal(graph, opts);
}

// ---------------------------------------------------------------- orthogonal routing: size, orientation, framing
function orthoScore(fr, fit) {
  const m = fr.metrics, s = fr.size;
  const phone = fit === 'wide' ? 0 : 24 * Math.max(0, 9 - phonePx(fr.W, s)) + 40 * Math.max(0, fr.H / fr.W - 1.3);
  return phone + (fr.W / s) * 0.15 + (fr.H / s) * 0.15 + m.crossings * 8 + (m.throughBoxes + m.titleHits) * 40 + m.labelNode * 20 + m.labelLabel * 40 + m.labelTitle * 30
    + m.labelOnLine * 14 + (m.labelChip || 0) * 1.5 + m.bends * 0.5 + (m.length / s) * 0.04 + fr.failed * 50;
}

function orthoAt(gr, s, fit) {
  const laneGap = Math.round(0.55 * s);
  let best = null;
  // if some label has no free place, give every channel more room and route again (twice at most)
  for (const extra of [0, 1.0, 2.0, 3.5]) {
    for (const v of rankLayouts(gr, s, fit, 4, laneGap, true, Math.round(extra * s))) {
      const rt = routeEdges(gr, { nodes: v.layout.nodes, groups: v.layout.groups, s }, {});
      const fr = frameRouted(gr, v, rt, s);
      fr.score = orthoScore(fr, fit);
      if (!best || fr.score < best.score - 1e-9) best = fr;
    }
    const m = best.metrics;
    if (best.failed === 0 && m.labelLabel + m.labelNode + m.labelTitle + m.throughBoxes + m.titleHits === 0 && m.labelOnLine === 0) break;
  }
  return best;
}

function layoutOrthogonal(graph, opts = {}) {
  const fit = opts.fit || 'balanced';
  const targetW = opts.targetW || 1000, maxH = opts.maxH || 1100;
  const one = (gr) => {
    let s = opts.size ? Math.max(8, Math.min(40, Math.round(opts.size))) : 18;
    let res = orthoAt(gr, s, fit);
    if (!opts.size) {
      for (let it = 0; it < 3; it++) {
        const k = Math.min(targetW / res.W, maxH / res.H);
        const ns = Math.max(10, Math.min(40, Math.round(s * k)));
        if (ns === s || (k > 0.88 && k < 1.12)) break;
        s = ns; res = orthoAt(gr, s, fit);
      }
    }
    while ((res.W > 2000 || res.H > 2000) && s > 8) { s -= 1; res = orthoAt(gr, s, fit); }
    res.fits = res.W <= 2000 && res.H <= 2000;
    res.direction = gr.direction;
    return res;
  };
  let res = one(graph);
  if (!opts.forceDirection) {
    const horizontal = graph.direction === 'LR' || graph.direction === 'RL';
    const alt = one({ ...graph, direction: horizontal ? 'TB' : 'LR' });
    // the other axis wins when its text is clearly bigger on a phone and it is not messier
    // legibility and shape are already part of the score (see orthoScore)
    if (alt.fits && alt.score < res.score - 1) res = alt;
  }
  return res;
}

function layoutCurve(graph, opts = {}) {
  const fit = opts.fit || 'balanced';
  const targetW = opts.targetW || 1000, maxH = opts.maxH || 1100;
  const sized = (gr) => {
    const tryS = (s) => frame(gr, chooseLayout(gr, s, fit), s);
    let s = opts.size ? Math.max(8, Math.min(40, Math.round(opts.size))) : 18;
    let res = tryS(s);
    if (!opts.size) {
      // text size scales the whole drawing only roughly (gaps and label widths do not scale linearly),
      // so walk towards the target frame width a few times
      for (let it = 0; it < 4; it++) {
        const k = Math.min(targetW / res.W, maxH / res.H);
        const ns = Math.max(10, Math.min(40, Math.round(s * k)));
        if (ns === s || (k > 0.85 && k < 1.12)) break;
        s = ns; res = tryS(s);
      }
    }
    while ((res.W > 2000 || res.H > 2000) && s > 8) { s -= 1; res = tryS(s); }
    res.fits = res.W <= 2000 && res.H <= 2000;
    res.direction = gr.direction;
    return res;
  };
  const phone = (r) => (r.size * 343) / r.W;
  const bad = (r) => r.metrics.crossings + r.metrics.throughBoxes + r.metrics.labelsOnBoxes + 2 * r.metrics.labelOverlaps;
  let res = sized(graph);
  // Keep the written direction unless its text would be unreadable on a phone (< 7 px in a 343 px column)
  // and the other axis is clearly better without making the drawing messier.
  if (!opts.forceDirection && phone(res) < 7) {
    const horizontal = graph.direction === 'LR' || graph.direction === 'RL';
    const alt = sized({ ...graph, direction: horizontal ? 'TB' : 'LR' });
    if (alt.fits && phone(alt) > phone(res) * 1.3 && bad(alt) <= bad(res) + 3) res = alt;
  }
  return res;
}

function frame(graph, best, s) {
  const { layout, curves } = best;
  const boxes = asBoxes(layout);
  const margin = Math.round(1.3 * s);
  // content bounds: boxes, groups, edge labels, curve points
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const take = (x, y, w = 0, h = 0) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h); };
  layout.nodes.forEach((n) => take(n.x, n.y, n.w, n.h));
  layout.groups.forEach((g) => take(g.x, g.y, g.w, g.h));
  graph.edges.forEach((e, i) => {
    const P = edgeCurve(boxes.get(e.from), boxes.get(e.to), curves[i]);
    for (let k = 0; k <= 8; k++) { const q = quad(P, k / 8); take(q[0] - 2, q[1] - 2, 4, 4); }
    if (e.label) { const r = labelRect(P, e.label, s); take(r.x, r.y, r.w, r.h); }
  });
  if (!isFinite(x0)) { x0 = y0 = 0; x1 = y1 = 100; }
  const dx = margin - x0, dy = margin - y0;
  const W = Math.max(200, Math.ceil(x1 - x0 + 2 * margin)), H = Math.max(120, Math.ceil(y1 - y0 + 2 * margin));
  const shift = (o) => ({ ...o, x: o.x + dx, y: o.y + dy });
  return {
    W, H, size: s,
    nodes: layout.nodes.map(shift), groups: layout.groups.map(shift), curves,
    direction: best.direction || graph.direction, flows: [...best.flows.entries()], metrics: measure(graph, { ...layout, nodes: layout.nodes.map(shift), groups: layout.groups.map(shift) }, curves),
  };
}

function frameRouted(graph, best, rt, s) {
  const { layout } = best;
  const margin = Math.round(1.3 * s);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const take = (x, y, w = 0, h = 0) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h); };
  layout.nodes.forEach((n) => take(n.x, n.y, n.w, n.h));
  layout.groups.forEach((g) => take(g.x, g.y, g.w, g.h));
  rt.routes.forEach((r) => { if (!r) return; r.points.forEach((p) => take(p[0] - 2, p[1] - 2, 4, 4)); if (r.label) take(r.label.x, r.label.y, r.label.w, r.label.h); });
  if (!isFinite(x0)) { x0 = y0 = 0; x1 = y1 = 100; }
  const dx = margin - x0, dy = margin - y0;
  const W = Math.max(200, Math.ceil(x1 - x0 + 2 * margin)), H = Math.max(120, Math.ceil(y1 - y0 + 2 * margin));
  const shift = (o) => ({ ...o, x: o.x + dx, y: o.y + dy });
  const routes = rt.routes.map((r) => (r ? { ...r, points: r.points.map((p) => [p[0] + dx, p[1] + dy]), label: r.label ? shift(r.label) : null } : null));
  const failed = graph.edges.filter((e, i) => !routes[i] && e.from !== e.to).length;
  return {
    W, H, size: s, routing: 'orthogonal', routes, routeWarnings: rt.warnings, failed,
    nodes: layout.nodes.map(shift), groups: layout.groups.map(shift), curves: graph.edges.map(() => 0),
    direction: graph.direction, flows: [...best.flows.entries()], metrics: rt.metrics,
  };
}

// One yardstick for both drawings (curved or routed) of a finished layout: counts of edges through boxes or group titles,
// edge crossings (pairs of edges that cross), labels on boxes, titles, each other and other edges.
function commonMetrics(graph, lay, chips = {}) {
  const layout = { nodes: lay.nodes, groups: lay.groups, s: lay.size };
  const glabels = lay.groups.map((g) => groupTitleRect(g, graph.groups.find((x) => x.id === g.id), lay.size));
  const routes = lay.routes || curveRoutes(graph, layout, lay.curves, edgeCurve, labelRect);
  return routeMetrics(graph, layout, routes, glabels, lay.size, chips);
}

// ---- compile.mjs
// Canonical graph + layout + schedule -> a motion_arch block (and the payload around it).




const r2 = (x) => Math.round(x * 100) / 100;
const r4 = (x) => Math.round(x * 10000) / 10000;
// the atom clamps every dur to 0.01-1 of the film, so a very long film cannot have very short windows
const pd = (seconds, D) => r4(Math.max(0.011, seconds / D));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

function clip(str, max) {
  const t = String(str).trim();
  return t.length <= max ? t : t.slice(0, max - 1).trimEnd() + '…';
}

// graph -> {block, layout, warnings, steps, schedule, durationSeconds}. The graph must already be valid.
function compileGraph(graph, opts = {}) {
  const warnings = [];
  const numbered = opts.numbered !== undefined ? !!opts.numbered : !!graph.numbered;
  const pace = opts.pace || graph.pace || 'normal';
  const duration = opts.duration !== undefined ? opts.duration : graph.duration;

  // ---- step numbers (shown only when numbered) and the edge labels the atom will draw
  const stepNo = numbered ? assignSteps(graph).steps : null;
  const drawn = graph.edges.map((e, i) => {
    if (!numbered) return e.label;
    const full = String(stepNo[i]) + (e.label ? ' ' + e.label : '');
    if (full.length > LIMITS.edgeLabel) warnings.push(`edge ${i + 1}: the step number pushes the label to ${full.length} characters; the atom shows at most ${LIMITS.edgeLabel}, so it is cut. Shorten the label.`);
    return full;
  });
  const g2 = { ...graph, edges: graph.edges.map((e, i) => ({ ...e, label: drawn[i] })) };

  const lay = layoutGraph(g2, opts);
  if (!lay.fits) throw new ArchError([`the diagram does not fit in the atom's 2000 x 2000 frame even at the smallest text size; shorten the labels or split the diagram`]);
  if (lay.direction !== graph.direction) {
    warnings.push(`drawn ${lay.direction === 'TB' ? 'top-to-bottom' : 'left-to-right'} instead of ${graph.direction}: that keeps the text about ${(lay.size * 343 / lay.W).toFixed(0)} px on a 343 px phone column. Pass --direction ${graph.direction} to force the written direction.`);
  }
  const { W, H, size } = lay;
  const horizontal = lay.direction === 'LR' || lay.direction === 'RL';
  const rev = lay.direction === 'RL' || lay.direction === 'BT';
  const byId = new Map(lay.nodes.map((n) => [n.id, n]));
  const gnode = new Map(graph.nodes.map((n) => [n.id, n]));

  // ---- messages -> edge index
  const msgEdge = graph.messages.map((m, j) => {
    let idx = graph.edges.findIndex((e) => e.from === m.from && e.to === m.to);
    let back = !!m.back;
    if (idx < 0) { idx = graph.edges.findIndex((e) => e.from === m.to && e.to === m.from); back = !back; }
    if (idx < 0) throw new ArchError([`message ${j + 1}: no edge between "${m.from}" and "${m.to}"`]);
    return { idx, back };
  });

  // ---- playing order of the edges: step numbers, else the order the flow reaches them
  const main = (n) => (horizontal ? n.x + n.w / 2 : n.y + n.h / 2);
  const sortedNodes = lay.nodes.map((n, i) => ({ id: n.id, m: main(n) * (rev ? -1 : 1), i })).sort((a, b) => a.m - b.m || a.i - b.i);
  const nodeRank = new Map(sortedNodes.map((n, k) => [n.id, k]));
  const E = graph.edges.length;
  const order = graph.edges.map((e, i) => i).sort((a, b) => {
    if (numbered) return stepNo[a] - stepNo[b];
    const ka = Math.max(nodeRank.get(graph.edges[a].from), nodeRank.get(graph.edges[a].to));
    const kb = Math.max(nodeRank.get(graph.edges[b].from), nodeRank.get(graph.edges[b].to));
    return ka - kb || a - b;
  });
  const lab = (id) => gnode.get(id).label;
  const sentence = graph.edges.map((e, i) => activity(lab(e.from), lab(e.to), e.label, { style: e.style, both: e.both, reply: graph.edges.some((o, j) => j !== i && o.from === e.to && o.to === e.from) && graph.edges.findIndex((o) => o.from === e.to && o.to === e.from) < i }));
  const info = order.map((ei) => ({ words: words(sentence[ei]), chips: msgEdge.filter((m) => m.idx === ei).length }));
  let sched;
  try { sched = buildSchedule(info, { pace, duration }); }
  catch (e) { if (e.archMessage) throw new ArchError([e.message]); throw e; }
  warnings.push(...sched.warnings);
  const D = sched.durationSeconds;
  const stepOf = new Map(order.map((ei, k) => [ei, k]));   // edge index -> position in the schedule

  // ---- nodes: pop in flow order during the lead-in
  const NODE_DUR = 0.3;
  const nodeAt = new Map(sortedNodes.map((n, k) => [n.id, 0.3 + (sortedNodes.length > 1 ? (k * 0.4) / (sortedNodes.length - 1) : 0)]));
  const nodes = graph.nodes.map((gn) => {
    const b = byId.get(gn.id);
    const o = { id: gn.id, kind: gn.kind || 'server', label: clip(gn.label, LIMITS.label) };
    if (gn.sub) o.sub = clip(gn.sub, LIMITS.sub);
    o.x = r2(((b.x + b.w / 2) / W) * 100); o.y = r2(((b.y + b.h / 2) / H) * 100);
    o.w = r2(clamp((b.w / W) * 100, 4, 100)); o.h = r2(clamp((b.h / H) * 100, 4, 100));
    o.at = r4(nodeAt.get(gn.id) / D); o.dur = pd(NODE_DUR, D);
    return o;
  });

  const edgeSec = (st) => Math.max(Math.min(0.5, (st.end - st.start) * 0.4), 0.011 * D);
  // ---- edges draw at their step's start
  const edges = graph.edges.map((e, i) => {
    const st = sched.schedule[stepOf.get(i)];
    const o = { from: e.from, to: e.to };
    if (drawn[i]) o.label = clip(drawn[i], LIMITS.edgeLabel);
    o.style = e.style === 'sync' || e.style === undefined ? 'solid' : 'dashed';
    if (e.both) o.both = true;
    const rt = lay.routes && lay.routes[i];
    if (rt) {
      o.points = rt.points.map((q) => ({ x: r2((q[0] / W) * 100), y: r2((q[1] / H) * 100) }));
      if (rt.label) o.label_at = { x: r2(((rt.label.x + rt.label.w / 2) / W) * 100), y: r2(((rt.label.y + rt.label.h / 2) / H) * 100) };
    } else if (lay.curves[i]) o.curve = lay.curves[i];
    o.at = r4(st.start / D); o.dur = pd(edgeSec(st), D);
    return o;
  });

  // ---- message chips ride inside their step's dwell, one after another
  const seen = new Map();
  const messages = graph.messages.map((m, j) => {
    const { idx, back } = msgEdge[j];
    const st = sched.schedule[stepOf.get(idx)];
    const k = info[stepOf.get(idx)].chips, jn = seen.get(idx) || 0; seen.set(idx, jn + 1);
    const dwell = st.end - st.start;
    const off = Math.max(CHIP_START, edgeSec(st) + 0.05);   // not before the edge is fully drawn
    const c = Math.min(CHIP_SECONDS, Math.max(0.3, (dwell - off - CHIP_TAIL - (k - 1) * CHIP_GAP) / k));
    const o = { edge: idx, text: clip(m.text, LIMITS.msgText) };
    if (back) o.back = true;
    o.at = r4((st.start + off + jn * (c + CHIP_GAP)) / D); o.dur = pd(c, D);
    return o;
  });

  const groups = lay.groups.map((g) => {
    const gg = graph.groups.find((x) => x.id === g.id);
    return { label: clip(gg.label, LIMITS.groupLabel), x: r2((g.x / W) * 100), y: r2((g.y / H) * 100), w: r2((g.w / W) * 100), h: r2((g.h / H) * 100), at: 0, dur: pd(0.3, D) };
  });

  const block = { type: 'motion_arch', label: clip(graph.title || 'Architecture diagram', LIMITS.title), w: W, h: H, size, nodes, edges };
  if (lay.routes) { block.radius = clamp(Math.round(size * 0.55), 6, 14); warnings.push(...lay.routeWarnings); }
  if (groups.length) block.groups = groups;
  if (messages.length) block.messages = messages;

  const steps = numbered ? order.map((ei, k) => {
    const e = graph.edges[ei];
    const o = { step: stepNo[ei], from: lab(e.from), to: lab(e.to), label: e.label || '', style: e.style || 'sync', activity: sentence[ei] };
    if (e.relation) o.relation = e.relation;
    return o;
  }) : [];
  // text alternative: every edge (full sentence) in playing order, and every message, always present, numbered or not
  const textSteps = order.map((ei, k) => {
    const e = graph.edges[ei];
    const o = { step: numbered ? stepNo[ei] : k + 1, from: lab(e.from), to: lab(e.to), label: e.label || '', style: e.style || 'sync', activity: sentence[ei] };
    if (e.relation) o.relation = e.relation;
    return o;
  });
  const textMessages = graph.messages.map((m, j) => {
    const { idx, back } = msgEdge[j], e = graph.edges[idx];
    return { step: textSteps[stepOf.get(idx)].step, text: m.text, from: lab(back ? e.to : e.from), to: lab(back ? e.from : e.to) };
  }).sort((a, b) => a.step - b.step);
  const relationColumn = numbered && (opts.relationColumn !== undefined ? !!opts.relationColumn : !!graph.relationColumn);
  const relationName = opts.relationName || graph.relationName || 'Relation';
  const schedule = sched.schedule.map((s, k) => ({ step: numbered ? stepNo[order[k]] : s.step, start: s.start, end: s.end }));
  return { block, layout: lay, warnings, steps, textSteps, textMessages, schedule, durationSeconds: D, numbered, pace, minimumSeconds: sched.minimumSeconds, relationColumn, relationName };
}

const STAGES = [['16:9', 1280, 720], ['4:3', 1200, 900], ['1:1', 1000, 1000], ['9:16', 720, 1280]];

// The steps table: a legend with the columns Step | Activity (and Relation when asked for). Full text, no cutting.
function stepsTable(steps, ctx = {}) {
  const rel = !!ctx.relationColumn;
  return {
    type: 'table', caption: 'Steps',
    headers: rel ? ['Step', 'Activity', ctx.relationName || 'Relation'] : ['Step', 'Activity'],
    rows: steps.map((s) => (rel ? [String(s.step), s.activity, s.relation || ''] : [String(s.step), s.activity])),
    col_widths: rel ? ['9%', '67%', '24%'] : ['9%', '91%'],
  };
}

// The messages table: Step | Message | Direction, full text. Only built when the diagram has messages.
function messagesTable(messages) {
  return {
    type: 'table', caption: 'Messages',
    headers: ['Step', 'Message', 'Direction'],
    rows: messages.map((m) => [String(m.step), m.text, `${m.from} to ${m.to}`]),
    col_widths: ['9%', '45%', '46%'],
  };
}

// The text alternative that goes after the diagram in every payload: the steps table (every edge as a full sentence)
// and the messages table. Uses the existing public `table` atom; the motion_arch atom itself is unchanged.
function textAlternative(ctx = {}) {
  const out = [];
  if (ctx.textSteps && ctx.textSteps.length) out.push(stepsTable(ctx.textSteps, ctx));
  if (ctx.textMessages && ctx.textMessages.length) out.push(messagesTable(ctx.textMessages));
  return out;
}

// Wrap the diagram (and, when numbered, the steps table) in ONE motion_timeline so both run on one clock.
// The diagram is the motion_arch block, p = t / duration. Each table row is a motion_text that fades in
// when its step's edge starts drawing; a translucent bar steps to the current row. The stage is the one of
// four shapes (or, for a tall diagram, a wide stage with the table beside it) that draws the diagram biggest.
function filmPayload(block, ctx = {}) {
  const D = ctx.durationSeconds || 9;
  const steps = ctx.steps || [], sch = ctx.schedule || [];
  const n = steps.length;
  const rel = !!ctx.relationColumn && n > 0, relName = ctx.relationName || 'Relation';
  const rows = steps.map((s) => rowText(s.step, s.activity, 60));
  const maxChars = Math.max(20, ...rows.map((r) => r.length));
  const relChars = rel ? Math.max(relName.length, ...steps.map((s) => (s.relation || '').length)) : 0;
  const gap = 24;
  const cands = [];
  // the text is one line per row: its size is what the table width allows
  const textSize = (tw, lo, hi) => clamp(Math.floor((tw * 0.94) / ((maxChars + (rel ? relChars + 3 : 0)) * 0.62)), lo, hi);
  for (const [aspect, sw, sh] of STAGES) {
    // the table text may shrink to about 1.95% of the stage width (6.7 px in a 343 px column) when that lets a tall diagram be bigger
    const cap = textSize(sw, 12, 24);
    for (const sz of new Set([cap, Math.min(cap, 16), Math.min(cap, Math.max(12, Math.ceil(sw * 0.0195)))])) {
      const rowH = Math.round(sz * 1.9), headH = Math.round(sz * 2.1);
      const T = n ? headH + n * rowH : 0;
      const scale = Math.min((sw * 0.96) / block.w, (sh - T - gap * (n ? 3 : 2)) / block.h);
      if (scale > 0) cands.push({ kind: 'stack', aspect, sw, sh, sz, rowH, headH, scale });
    }
  }
  if (n) for (const [aspect, sw, sh] of STAGES.slice(0, 2)) for (const f of [0.34, 0.4, 0.46]) {
    const tw = sw * f - gap, sz = textSize(tw, 11, 22);
    const rowH = Math.round(sz * 1.9), headH = Math.round(sz * 2.1);
    if (headH + n * rowH > sh - 2 * gap) continue;
    if (maxChars * sz * 0.62 > tw * 0.97) continue;           // the longest row must fit its line
    const scale = Math.min((sw * (1 - f) - 2 * gap) / block.w, (sh - 2 * gap) / block.h);
    if (scale > 0) cands.push({ kind: 'side', aspect, sw, sh, sz, rowH, headH, scale, f });
  }
  // Stages differ in width, and the player is shown at the width of its column, so what the viewer gets is the diagram's size
  // relative to the stage WIDTH (scale / sw), not the raw scale. The table's text must stay readable too (>= 1.65% of the width,
  // about 5.7 px in a 343 px column); a stage where it would be smaller is not considered unless nothing else is left.
  const shown = (c) => c.scale / c.sw;
  const legible = cands.filter((c) => !n || c.sz / c.sw >= 0.0165);
  let best = null;
  // biggest diagram wins; within 1% the larger table text wins
  for (const c of legible.length ? legible : cands) if (!best || shown(c) > shown(best) * 1.01 || (shown(c) > shown(best) * 0.99 && c.sz / c.sw > best.sz / best.sw)) best = c;
  if (!best) throw new ArchError(['the diagram and its steps table do not fit on one film stage; reduce the number of steps or the diagram size']);
  const { aspect, sw, sh, sz, rowH, headH, scale } = best;
  const pw = block.w * scale, ph = block.h * scale;
  let px, py, tx, tw, top;
  if (best.kind === 'side') {
    const reg = sw * (1 - best.f);
    px = (reg - pw) / 2; py = (sh - ph) / 2;
    tx = reg + gap / 2; tw = sw * best.f - gap * 1.5; top = gap;
  } else {
    px = (sw - pw) / 2; py = gap;
    tx = sw * 0.03; tw = sw * 0.94; top = py + ph + gap;
  }
  const arch = { ...block, id: 'arch', place: { x: r2((px / sw) * 100), y: r2((py / sh) * 100), w: r2((pw / sw) * 100), h: r2((ph / sh) * 100), z: 1 } };
  const blocks = [arch];
  const tracks = [{ target: 'arch', keys: [{ t: 0, p: 0 }, { t: D, p: 1, ease: 'linear' }] }];
  if (n) {
    const xPct = r2((tx / sw) * 100), wPct = r2((tw / sw) * 100);
    const aw = rel ? r2(wPct * 0.68) : wPct, rx = r2(xPct + wPct * 0.7), rw = r2(wPct * 0.3);
    blocks.push({ type: 'motion_text', id: 'head', text: 'STEP  ACTIVITY', size: Math.max(11, sz - 3), font: 'mono', weight: 'bold', mode: 'block', reveal: 'fade', color: '#9ca5b1', place: { x: xPct, y: r2((top / sh) * 100), w: aw, z: 2 } });
    if (rel) blocks.push({ type: 'motion_text', id: 'headrel', text: relName.toUpperCase(), size: Math.max(11, sz - 3), font: 'mono', weight: 'bold', mode: 'block', reveal: 'fade', color: '#9ca5b1', place: { x: rx, y: r2((top / sh) * 100), w: rw, z: 2 } });
    const rowY = (k) => top + headH + k * rowH;
    blocks.push({ type: 'motion_shape', id: 'hl', shape: 'rect', draw: 'none', fill: '#8d98ff', radius: 8, place: { x: r2(xPct - 1.2), y: r2((rowY(0) - 4) / sh * 100), w: r2(wPct + 2.4), h: r2((rowH - 2) / sh * 100), z: 1 } });
    const hlKeys = [{ t: 0, y: r2((rowY(0) - 4) / sh * 100), opacity: 0 }];
    steps.forEach((s, k) => {
      const t0 = sch[k].start;
      const fade = [{ t: 0, opacity: 0 }, { t: t0, opacity: 0 }, { t: r2(t0 + 0.3), opacity: 1, ease: 'standard' }];
      blocks.push({ type: 'motion_text', id: 'row' + (k + 1), text: rows[k], size: sz, font: 'mono', weight: 'regular', mode: 'block', reveal: 'fade', place: { x: xPct, y: r2((rowY(k) / sh) * 100), w: aw, z: 2 } });
      tracks.push({ target: 'row' + (k + 1), keys: fade });
      if (rel && s.relation) {
        blocks.push({ type: 'motion_text', id: 'rel' + (k + 1), text: s.relation, size: sz, font: 'mono', weight: 'regular', mode: 'block', reveal: 'fade', color: '#9ca5b1', place: { x: rx, y: r2((rowY(k) / sh) * 100), w: rw, z: 2 } });
        tracks.push({ target: 'rel' + (k + 1), keys: fade });
      }
      hlKeys.push(k === 0
        ? { t: t0, y: r2((rowY(0) - 4) / sh * 100), opacity: 0, ease: 'hold' }
        : { t: t0, y: r2((rowY(k) - 4) / sh * 100), opacity: 0.22, ease: 'hold' });
      if (k === 0) hlKeys.push({ t: r2(t0 + 0.3), opacity: 0.22, ease: 'standard' });
    });
    tracks.push({ target: 'hl', keys: hlKeys });
  }
  return {
    theme: 'dark',
    blocks: [{
      type: 'motion_timeline', title: block.label, aspect, duration: D, loop: true, autoplay: true, controls: true, theme: 'dark',
      poster: r2(Math.max(0, D - 0.5)), blocks, tracks,
    }, ...textAlternative(ctx)],
  };
}

// Standalone payload: the finished diagram, then the steps table and (when there are messages) the messages table.
function archPayload(block, ctx = {}) {
  return { theme: 'dark', blocks: [block, ...textAlternative(ctx)] };
}

// Validate the compiled block against the atom's own limits.
function validateBlock(b) {
  const errs = [];
  if (b.type !== 'motion_arch') errs.push('type must be motion_arch');
  if (!(b.w >= 200 && b.w <= 2000)) errs.push(`w ${b.w} outside 200-2000`);
  if (!(b.h >= 120 && b.h <= 2000)) errs.push(`h ${b.h} outside 120-2000`);
  if (!(b.size >= 8 && b.size <= 40)) errs.push(`size ${b.size} outside 8-40`);
  if (b.radius !== undefined && !(b.radius >= 0 && b.radius <= 60)) errs.push(`radius ${b.radius} outside 0-60`);
  const nodes = b.nodes || [], edges = b.edges || [], groups = b.groups || [], msgs = b.messages || [];
  if (nodes.length > LIMITS.nodes) errs.push('too many nodes');
  if (edges.length > LIMITS.edges) errs.push('too many edges');
  if (groups.length > LIMITS.groups) errs.push('too many groups');
  if (msgs.length > LIMITS.messages) errs.push('too many messages');
  const ids = new Set();
  for (const n of nodes) {
    if (!/^[a-z][a-z0-9_-]{0,31}$/.test(n.id)) errs.push(`node id ${n.id} invalid`);
    ids.add(n.id);
    if (n.x < 0 || n.x > 100 || n.y < 0 || n.y > 100) errs.push(`node ${n.id} centre outside 0-100`);
    if (n.w < 4 || n.h < 4) errs.push(`node ${n.id} too small`);
    if (n.label.length > 40 || (n.sub && n.sub.length > 40)) errs.push(`node ${n.id} text too long`);
    if (n.at < 0 || n.at > 1 || n.dur < 0.01 || n.dur > 1) errs.push(`node ${n.id} timing outside 0-1`);
  }
  edges.forEach((e, i) => {
    if (!ids.has(e.from) || !ids.has(e.to)) errs.push(`edge ${i} dangling`);
    if (e.curve !== undefined && (e.curve < -100 || e.curve > 100)) errs.push(`edge ${i} curve`);
    if (e.points !== undefined) {
      if (!Array.isArray(e.points) || e.points.length < 2 || e.points.length > 10) errs.push(`edge ${i} points: 2 to 10 needed`);
      else if (e.points.some((q) => !(q.x >= 0 && q.x <= 100 && q.y >= 0 && q.y <= 100))) errs.push(`edge ${i} points outside the frame`);
    }
    if (e.label_at !== undefined && !(e.label_at.x >= 0 && e.label_at.x <= 100 && e.label_at.y >= 0 && e.label_at.y <= 100)) errs.push(`edge ${i} label_at outside the frame`);
    if (e.label && e.label.length > 48) errs.push(`edge ${i} label too long`);
    if (e.at < 0 || e.at > 1 || e.dur < 0.01 || e.dur > 1 || e.at + e.dur > 1.0001) errs.push(`edge ${i} timing outside 0-1`);
  });
  msgs.forEach((m, i) => {
    if (!(m.edge >= 0 && m.edge < edges.length)) errs.push(`message ${i} edge index`);
    if (m.text.length > 40) errs.push(`message ${i} text too long`);
    if (m.at + m.dur > 1.0001 || m.dur < 0.01) errs.push(`message ${i} timing outside the film`);
  });
  groups.forEach((g, i) => {
    if (g.x < 0 || g.y < 0 || g.w < 1 || g.h < 1 || g.x + g.w > 100.01 || g.y + g.h > 100.01) errs.push(`group ${i} outside frame`);
  });
  return errs;
}

// ---- index.mjs
// Library entry: mermaidToArch(text, opts) -> {payload, graph, warnings}









// opts: {routing:'orthogonal'|'curve' (default orthogonal), direction, title, size, fit:'balanced'|'wide', film:boolean, numbered:boolean, pace:'slow'|'normal'|'fast', duration:seconds, relationColumn:boolean, relationName:string}
function graphToArch(graph, opts = {}) {
  const g = { ...graph };
  if (opts.direction) g.direction = opts.direction;
  if (opts.title) g.title = opts.title;
  if (!g.direction) g.direction = 'LR';
  const { errors, warnings } = validateGraph(g);
  if (errors.length) throw new ArchError(errors, warnings);
  const lopts = { ...opts, forceDirection: !!opts.direction };
  const c = compileGraph(g, lopts);
  const { block, layout, warnings: w2 } = c;
  const bad = validateBlock(block);
  if (bad.length) throw new ArchError(['internal: compiled block breaks the atom limits: ' + bad.join('; ')], warnings);
  const ctx = { steps: c.steps, textSteps: c.textSteps, textMessages: c.textMessages, schedule: c.schedule, durationSeconds: c.durationSeconds, relationColumn: c.relationColumn, relationName: c.relationName };
  const payload = opts.film ? filmPayload(block, ctx) : archPayload(block, ctx);
  return { payload, graph: g, warnings: [...warnings, ...w2], block, layout, steps: c.steps, textSteps: c.textSteps, textMessages: c.textMessages, schedule: c.schedule, durationSeconds: c.durationSeconds, pace: c.pace, minimumSeconds: c.minimumSeconds, numbered: c.numbered, relationColumn: c.relationColumn, relationName: c.relationName };
}

function mermaidToArch(text, opts = {}) {
  const parsed = parseMermaid(text, opts);
  const r = graphToArch(parsed.graph, { ...opts, direction: opts.direction });
  r.warnings = [...parsed.warnings, ...r.warnings];
  return r;
}

function d2ToArch(text, opts = {}) {
  const parsed = parseD2(text, opts);
  const r = graphToArch(parsed.graph, { ...opts, direction: opts.direction });
  r.warnings = [...parsed.warnings, ...r.warnings];
  return r;
}

<script>
(function () {
  var DEFAULT_BUNDLE = '../../public/surfaces/mcp-apps/renderer-bundle.html';
  // ?bundle= may only point at an http(s) page on this origin: a javascript: or data: URL would run in this page's origin
  var BUNDLE = DEFAULT_BUNDLE;
  try {
    var asked = (location.search.match(/[?&]bundle=([^&]+)/) || [])[1];
    if (asked) { var u = new URL(decodeURIComponent(asked), location.href); if ((u.protocol === 'http:' || u.protocol === 'https:') && u.origin === location.origin) BUNDLE = u.href; }
  } catch (e) { /* keep the default */ }
  var frame = document.getElementById('view'), ready = false, pending = null, last = null;
  function post(m) { frame.contentWindow.postMessage(m, '*'); }
  function send() { if (ready && pending) { post({ jsonrpc: '2.0', method: 'ui/notifications/tool-result', params: { content: [], structuredContent: pending } }); } }
  window.addEventListener('message', function (ev) {
    if (ev.source !== frame.contentWindow) return;
    var m = ev.data; if (!m || m.jsonrpc !== '2.0') return;
    if (m.method === 'ui/initialize') { post({ jsonrpc: '2.0', id: m.id, result: { protocolVersion: '2026-01-26', hostInfo: { name: 'mermaid-arch-playground', version: '1' }, hostCapabilities: {}, hostContext: { theme: 'dark', displayMode: 'inline' } } }); return; }
    if (m.method === 'ui/notifications/initialized') { ready = true; send(); return; }
    if (m.method === 'ui/request-display-mode' && m.id) post({ jsonrpc: '2.0', id: m.id, result: { mode: 'inline' } });
  });
  frame.addEventListener('load', function () { setTimeout(function () { ready = true; send(); }, 700); });
  function reloadView() { ready = false; frame.src = BUNDLE + (BUNDLE.indexOf('?') < 0 ? '?' : '&') + Date.now(); }
  reloadView();
  function fit(asp) { frame.style.height = Math.round(frame.clientWidth * asp + 84) + 'px'; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function convert() {
    var msgs = document.getElementById('msgs'), opts = { film: document.getElementById('film').checked, numbered: document.getElementById('num').checked, pace: document.getElementById('pace').value, routing: document.getElementById('routing').value, relationColumn: document.getElementById('rel').checked };
    var d = document.getElementById('dir').value; if (d) opts.direction = d;
    try {
      var r = mermaidToArch(document.getElementById('src').value, opts);
      last = r.payload;
      var b = r.block, html = '<span class="ok">ok: ' + b.nodes.length + ' nodes, ' + b.edges.length + ' edges, ' + (b.groups || []).length + ' groups, ' + (b.messages || []).length + ' messages; frame ' + b.w + 'x' + b.h + ', text ' + b.size + ' px (about ' + (b.size * 343 / b.w).toFixed(1) + ' px in a 343 px phone column)</span>';
      r.warnings.forEach(function (w) { html += '\n<span class="warn">warning: ' + esc(w) + '</span>'; });
      msgs.innerHTML = html;
      document.getElementById('json').textContent = JSON.stringify(r.payload, null, 1);
      var t = r.payload.blocks[0];
      var extra = 0.3 + 0.07 * (r.textSteps.length + r.textMessages.length);   // the text-alternative tables follow every payload
      fit((opts.film ? { '16:9': 9 / 16, '4:3': 3 / 4, '1:1': 1, '9:16': 16 / 9 }[t.aspect] : (b.h / b.w)) + extra);
      document.getElementById('dur').textContent = opts.film ? 'film ' + r.durationSeconds.toFixed(1) + ' s, ' + r.schedule.length + ' steps, pace ' + r.pace : '';
      pending = r.payload; reloadView();
      document.getElementById('note').textContent = opts.film ? 'Playing in the renderer’s own film controls.' : 'Standalone: the finished diagram, then the steps and messages tables (the text alternative).';
    } catch (e) {
      if (e && e.errors) msgs.innerHTML = e.errors.map(function (m) { return '<span class="err">error: ' + esc(m) + '</span>'; }).join('\n');
      else msgs.innerHTML = '<span class="err">internal error: ' + esc(e && e.message) + '</span>';
    }
  }
  document.getElementById('go').onclick = convert;
  document.getElementById('src').addEventListener('input', function () { clearTimeout(convert.t); convert.t = setTimeout(convert, 500); });
  document.getElementById('dir').onchange = convert; document.getElementById('film').onchange = convert; document.getElementById('num').onchange = convert; document.getElementById('pace').onchange = convert; document.getElementById('rel').onchange = convert; document.getElementById('routing').onchange = convert;
  function api() { try { var o = frame.contentWindow.__a2uiMotion; return o && o[Object.keys(o)[0]] || null; } catch (e) { return null; } }
  function playing() { try { var r = frame.contentDocument.querySelector('.mt-root'); return !!r && r.getAttribute('data-pl') === '1'; } catch (e) { return false; } }
  document.getElementById('pp').onclick = function () { var a = api(); if (!a) return; if (playing()) a.pause(); else a.play(); };
  document.getElementById('rs').onclick = function () { var a = api(); if (!a) return; a.seek(0); a.play(); };
  setInterval(function () { document.getElementById('pp').textContent = playing() ? 'Pause' : 'Play'; }, 300);
  document.getElementById('copy').onclick = function () { if (last && navigator.clipboard) navigator.clipboard.writeText(JSON.stringify(last)); };
  convert();
})();
</script>
