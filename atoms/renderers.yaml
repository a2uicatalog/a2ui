# Renderer registry (DRAFT, local only). A separate dimension from `x-surfaces`:
#   x-surfaces  = WHERE an atom appears (web, mcp-apps, android, pdf, ...)
#   x-renderers = WHAT draws it (react, lit, angular, copilotkit, a2ui-vue, flutter, compose)
#
# Read with yaml.safe_load by scripts/gen_renderer_matrix.py. Contains no machine paths:
# measured facts (versions, dates, hashes) live in data/renderer-results/, never here.
# Documentation: docs/renderer-matrix.md
schema: a2ui-renderers/2
trademark_note: "React, Angular, Lit, CopilotKit, Vue and their logos are trademarks or registered trademarks of their respective owners. They are used here only to identify the renderers this catalog has been tested with, and do not imply affiliation with or endorsement by those owners. Logo artwork: simple-icons (CC0) for React, Lit, Angular and Vue, and CopilotKit's public repository for its mark; the marks remain their owners'."
trademark_note_extra: "Flutter and Compose are likewise trademarks of their respective owners; no logo is shown for them."
independence_note: "Independent and unofficial; not affiliated with Google, CopilotKit or the Vue project."

# Status rules, versioned. The generator implements exactly these; changing a rule means
# bumping `version` and regenerating. Rules are applied per case; an atom with several cases
# takes the WORST case.
rules:
  version: 4
  web:
    kind: web
    order_worst_first: [not_supported, drawn_with_differences, not_verified, drawn]
    not_supported: "the painted check failed (error or broken flag)"
    drawn_with_differences: "any of: pixel parity vs React failed (plain pass/fail in deterministic mode, no allowance list); text differs from React; horizontal overflow at 360 px; contrast worse than React in the same environment; behaviour probe differs from React"
    not_verified: "no difference found but the atom could not be verified: no visible text, blank on both sides in an environment, or (non-deterministic measurements only) a check recorded as unstable (allowance list). In deterministic mode stability is proven by two identical passes, so nothing is unstable"
    drawn: "every check passed (or is not applicable: no probe, behaviour lane not run, not a gate lane, React as reference)"
    not_measured: "no example payload for the atom in the gate data"
  compose:
    kind: compose
    order_worst_first: [not_supported, not_measured, native]
    native: "the atom's own type is a Basic component and the lane case rendered without error (Compose has no implementation of our atoms)"
    not_supported: "the lane case was rejected: the atom type is not in the Basic catalog"
    not_measured: "no example payload for the atom in the gate data"
  flutter:
    kind: flutter
    order_worst_first: [not_supported, not_measured, degraded, native]
    native: "lane case painted with the atom's own type present"
    degraded: "lane case lowered to Basic components (own type absent)"
    not_supported: "unsupported or unsupported_other lane status"
    not_measured: "invalid_payload (the example is invalid, so the atom itself is untested), or no lane case"

renderers:
- id: react
  name: React
  kind: web
  measured: true
  package: "@a2ui/react"
  protocol: "v1.0 through the web_core v1_0 module (the Basic lane of the gate runs v0.9)"
  platform: "web (React, Chromium)"
  logo: react.svg
  note: "The reference renderer: the other web renderers are compared with it pixel for pixel. Its own pixel column is measured against its own frozen reference shots, so parity is recorded as reference, not as a pass."
- id: lit
  name: Lit
  kind: web
  measured: true
  package: "@a2ui/lit"
  protocol: "v0.9"
  platform: "web (Lit web components, Chromium)"
  logo: lit.svg
  note: "No v1.0 export exists for Lit, so v1.0 was not measured. Dark 360 px is not a gate lane for Lit."
- id: angular
  name: Angular
  kind: web
  measured: true
  package: "@a2ui/angular"
  protocol: "v0.9"
  platform: "web (Angular, Chromium)"
  logo: angular.svg
  note: "Measured against the React lane on the same code."
- id: copilotkit
  name: CopilotKit
  kind: web
  measured: true
  package: "@copilotkit/a2ui-renderer"
  protocol: "v1.0 (A2UI 1.0 catalog path)"
  platform: "web (React, stock CopilotKit renderer, Chromium)"
  logo: copilotkit.svg
  note: "CopilotKit draws our atoms inside ITS wrapper and theme, so the custom-lane numbers measure whether the wrapper changes how our atoms look and behave, not CopilotKit's own components. Primary measurement: version 1.87.0 on A2UI 1.0, our custom lane and four pixel lanes; the behaviour lane was not run for 1.87.0, so behaviour is recorded as not run, never as a pass."
  notes_extra:
    - "All 670 gate examples render through the A2UI 1.0 path with no validation failure, no unknown component and no crash."
    - "Ten atoms overflow at width in every lane (divider, youtube, image, tabs, audio_player, video_card, info_card, glass_card, hub, content_tabs). The counts on this page cover the public stable atoms only."
    - "Ten atoms now render markdown headings and bold in the stock Text and differ from React for real: body, heading, subheading, video_card, split_pane, numbered_list, columns, info_card, glass_card, hub."
    - "Deterministic: every 1.87.0 shot was taken twice on the shipped build and A equals B (one dither-only exception, gmail_inbox in dark 480), so pixel results are plain pass or fail with no allowance list; the custom text hash is also identical in both passes and agrees with React on 663 of 670 examples (differing: audio_player, body, bullet_list, color_section, numbered_list, quote, video_card). Painting and visible text come from one earlier, non-deterministic CopilotKit 1.87.0 run; the behaviour lane was not run."
    - "Three atoms fail the pixel rule in 1.87.0 only and are unexplained: page_header (all four environments), code_snippet_pair and image_with_caption (480 px, both themes). Content sits 1 px lower than in React and in 1.85.0, identically in both passes; the cause was not isolated. They are shown as drawn with differences, with a note, not hidden."
  earlier_measurement: "Earlier measurement, CopilotKit 1.85.0 on the v0.9 dialect (same shipped commit): pixel parity with React 593 of 640 non-blank shots (light 480), 627 of 670 (dark 480), 595 of 640 (light 360), 627 of 670 (dark 360); custom text painted 617 of 670. Superseded by 1.87.0; version and dialect changed together, so the two are not a like-for-like comparison."
- id: a2ui-vue
  name: a2ui-vue
  kind: web
  measured: true
  package: "a2ui-vue"
  protocol: "v0.9"
  platform: "web (Vue 3, stock a2ui-vue, Chromium)"
  logo: vuedotjs.svg
  note: "a2ui-vue draws our atoms inside ITS wrapper and theme, so the custom-lane numbers measure the wrapper, not a2ui-vue's own components. Vue-only pixel failures were not traced."
- id: flutter
  name: Flutter
  kind: flutter
  measured: true
  package: "a2ui_flutter"
  protocol: "v1.0"
  platform: "Flutter widget-test engine (headless); no device"
  logo: ""
  note: "Partial coverage: only a part of the atoms are ported to native Flutter widgets. Text parity with the web painter was checked on the atoms listed in the parity sweep; the Basic lane was not measured by us; no device run. Measured on a private, unpublished build, after the lane merges."
- id: compose
  name: Compose
  kind: compose
  measured: true
  package: "a2ui-kmp"
  protocol: "v0.9 only (spec v0.9.1; no v1.0 claim)"
  platform: "Compose Desktop on the JVM (Jetpack Compose family); not Android"
  logo: ""
  environment: "a2ui-kmp 1.0.0-alpha02 (third-party Kotlin Multiplatform rebuild of Google's androidx.a2ui), Compose Desktop on JVM with Skiko software rendering, measured on the A2UI v0.9.1 dialect; not an Android device; the pixel lane is not meaningful (fonts, Material 3 look)"
  note: "Compose has no implementation of our atoms: every atom whose root is not a Basic component is not supported. Only atoms whose root type is a Basic component (Text, Column, Button, Tabs and so on) draw, through the Basic catalog."
  notes_extra:
    - "Pixel parity with React is not meaningful here (different fonts, Material 3 look), so the pixel lane is recorded for information and never decides a status."
