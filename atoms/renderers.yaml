# Renderer registry (DRAFT, local only). A separate dimension from `x-surfaces`:
#   x-surfaces  = WHERE an atom appears (web, mcp-apps, android, pdf, ...)
#   x-renderers = WHAT draws it (react, lit, angular, copilotkit, a2ui-vue, flutter, compose)
# Per-atom status values: native | degraded | not_supported | not_measured
# Read by scripts/gen_renderer_matrix.py (minimal parser: flat `- id:` list items, scalar values only).
# Sources are named in `data_source`; all paths are read-only inputs on the build machine.
