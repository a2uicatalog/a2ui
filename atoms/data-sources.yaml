# data-sources.yaml — declared network data access for A2UI surfaces.
#
# THE RULE: no renderer, bundle, or worker route touches an external data
# host unless it is declared here. This file is the single source of truth;
# gen_data_sources.py compiles it into:
#   - public/catalogue/data-sources-v1.json   (public, agent-readable registry)
#   - the browser bundle's A2UI_DATA_SOURCES const (via gen_mcp_apps_bundle)
#   - the mcp-worker proxy table (via a2ui-private sync, deployed separately)
# The csp.connect_domains list below is ALSO what the Phase-2 ui:// resource
# declares as _meta.ui.csp.connectDomains — CSP posture is catalogue data,
# not code.
#
# CF-pipe discipline (every knob is declared, none implied):
#   cache_ttl_s      — edge-cache lifetime; bounds upstream fetches to
#                      <= 60/ttl per minute PER PARAM TUPLE no matter how
#                      many viewers are connected
#   per_ip_per_min   — per-visitor request ceiling at the proxy
#   upstream_per_min — global upstream budget for the source (belt+braces
#                      over the cache); exceeded -> serve stale or 429
#   project_fields   — response projection: strip everything the consumers
#                      don't read BEFORE it leaves the worker (adsb.lol
#                      payloads are ~50KB raw; projected ~4KB -> ~92% less
#                      egress through the CF pipe)
#   min_client_refresh_s — bundles clamp their polling to max(this,
#                      cache_ttl_s); polling faster than the cache TTL only
#                      burns the visitor's battery, never the pipe

# Access control (declared per source, enforced wherever the source is
# served — worker proxy now, MCP tool gate and host CSP in Phase 2):
#   access.tier:
#     public     — anonymous, rate-limited only (demo-grade data)
#     keyed      — requires a capability key (the x-demo-bypass pattern,
#                  per-key limits; how hidden/by-URL pages get data)
#     user       — requires an authenticated human (OAuth session at the
#                  proxy; the browser playground case)
#     agent      — requires an authenticated MCP client (MCP OAuth 2.1;
#                  the agent-in-the-loop case — claude.ai calling tools
#                  that read this source on the user's behalf)
#   access.scope — the scope string checked by ALL enforcement points; one
#                  vocabulary shared by human sessions and agent tokens, so
#                  a human in the playground and an agent in chat are
#                  authorized by the SAME declaration.
#   Tiers compose upward: a `user` or `agent` principal always satisfies
#   `keyed` and `public`.

# Upstream credentials (added 2026-09-25 for Rebrickable):
#   upstream_auth: {secret: REBRICKABLE_API_KEY, header: Authorization, prefix: "key "}
#   The worker reads the VALUE from its own secret store (env[secret], set with `wrangler secret put`) and sends
#   it upstream as `header: prefix + value`. Only the secret's NAME and the header shape live here; the value never
#   appears in this file, the public registry, the browser bundle, a cache key or a response. If the secret is
#   not set the proxy answers 503 "upstream credential not configured" rather than calling upstream without it.
#   Compiler guards (gen_data_sources.py): secret is UPPER_SNAKE, header is Authorization or X-*, cache_ttl_s >= 3600,
#   and a `public` source that spends a credential must keep per_ip_per_min <= 20 — a keyed upstream is a shared
#   quota, so it is cached hard and rate-limited by declaration.

version: 1

csp:
  connect_domains:
    - https://a2uicatalog.ai

proxy_base: https://a2uicatalog.ai/api/data

sources:
  adsb:
    description: Live ADS-B traffic via adsb.lol (free, no auth). Feeds
      adsb_feed -> airspace_command_deck and friends.
    upstream: "https://api.adsb.lol/v2/lat/{lat}/lon/{lon}/dist/{dist}"
    params:
      lat: {type: number, default: 43.629}
      lon: {type: number, default: 1.363}
      dist: {type: number, default: 40, max: 60}
    cache_ttl_s: 10
    min_client_refresh_s: 15
    limits:
      per_ip_per_min: 12
      upstream_per_min: 20
    project_fields:
      root: ac
      fields: [flight, hex, lat, lon, alt_baro, gs, track, squawk]
    content_type: application/json
    access: {tier: public, scope: "data:adsb:read"}
    consumers: [adsb_feed]

  metar:
    description: METAR weather via aviationweather.gov. Feeds metar_feed.
    upstream: "https://aviationweather.gov/api/data/metar?ids={station}&format=raw&hours=1"
    params:
      station: {type: string, pattern: "^[A-Z0-9]{4}$", default: LFBO}
    cache_ttl_s: 300
    min_client_refresh_s: 60
    limits:
      per_ip_per_min: 6
      upstream_per_min: 6
    content_type: text/plain
    access: {tier: public, scope: "data:metar:read"}
    consumers: [metar_feed]

  open_meteo:
    description: Free, no-auth daily/current forecast via open-meteo.com. Feeds
      weather_now -> weather_outlook (Toulouse Chat demo and any other city
      pointed at via lat/lon).
    upstream: "https://api.open-meteo.com/v1/forecast?latitude={lat}&longitude={lon}&current=temperature_2m,relative_humidity_2m,weathercode,windspeed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode&timezone=Europe%2FParis&forecast_days=3"
    params:
      lat: {type: number, default: 43.6047}
      lon: {type: number, default: 1.4442}
    cache_ttl_s: 1800
    min_client_refresh_s: 1800
    limits:
      per_ip_per_min: 6
      upstream_per_min: 10
    project_fields:
      fields: [current, daily]
    content_type: application/json
    access: {tier: public, scope: "data:open_meteo:read"}
    consumers: [weather_now, weather_outlook]

  workspace_status:
    description: Google Workspace service incidents feed (public, no auth). Feeds
      service_status_board -> incident_log -> stat_pulse. Current status is
      DERIVED (operational unless a service holds an unresolved incident) —
      the feed itself is history, not a live traffic-light.
    upstream: "https://www.google.com/appsstatus/dashboard/incidents.json"
    cache_ttl_s: 300
    min_client_refresh_s: 300
    limits:
      per_ip_per_min: 6
      upstream_per_min: 10
    project_fields:
      fields: [service_name, status_impact, severity, begin, end, external_desc]
    content_type: application/json
    access: {tier: public, scope: "data:workspace_status:read"}
    consumers: [service_status_board, incident_log, stat_pulse]

  # Rebrickable (rebrickable.com/api/v3) — real LEGO part, colour and set data. Feeds brick_build_3d's planned
  # set / part lookups. Key: worker secret REBRICKABLE_API_KEY. The API is rate-limited (about 1 request/second on
  # a free key), so everything below is cached for a day or more and budgeted low. Attribution: Rebrickable.
  rebrickable_set:
    description: One LEGO set by number (name, year, part count, image, Rebrickable page) via Rebrickable.
    upstream: "https://rebrickable.com/api/v3/lego/sets/{set_num}/"
    upstream_auth: {secret: REBRICKABLE_API_KEY, header: Authorization, prefix: "key "}
    params:
      set_num: {type: string, pattern: "^[0-9A-Za-z]{1,10}(-[0-9]{1,2})?$", default: "75954-1"}
    cache_ttl_s: 86400
    min_client_refresh_s: 86400
    limits:
      per_ip_per_min: 10
      upstream_per_min: 20
    content_type: application/json
    access: {tier: public, scope: "data:rebrickable_set:read"}
    consumers: [brick_build_3d]

  rebrickable_set_parts:
    description: A set's parts inventory (part, colour, quantity), one page of up to 1000 part/colour rows, via
      Rebrickable. Sets with more than 1000 distinct part/colour rows are truncated, and `next` is not passed on.
    upstream: "https://rebrickable.com/api/v3/lego/sets/{set_num}/parts/?page_size=1000&inc_color_details=0"
    upstream_auth: {secret: REBRICKABLE_API_KEY, header: Authorization, prefix: "key "}
    params:
      set_num: {type: string, pattern: "^[0-9A-Za-z]{1,10}(-[0-9]{1,2})?$", default: "75954-1"}
    cache_ttl_s: 86400
    min_client_refresh_s: 86400
    limits:
      per_ip_per_min: 6
      upstream_per_min: 12
    project_fields:
      root: results
      fields: [quantity, is_spare, part, color]
    content_type: application/json
    access: {tier: public, scope: "data:rebrickable_set_parts:read"}
    consumers: [brick_build_3d]

  rebrickable_colors:
    description: Every LEGO colour (id, name, rgb, transparency) via Rebrickable, for resolving a model's hex
      colours to real LEGO colours.
    upstream: "https://rebrickable.com/api/v3/lego/colors/?page_size=1000"
    upstream_auth: {secret: REBRICKABLE_API_KEY, header: Authorization, prefix: "key "}
    cache_ttl_s: 604800
    min_client_refresh_s: 604800
    limits:
      per_ip_per_min: 6
      upstream_per_min: 6
    project_fields:
      root: results
      fields: [id, name, rgb, is_trans]
    content_type: application/json
    access: {tier: public, scope: "data:rebrickable_colors:read"}
    consumers: [brick_build_3d]

  rebrickable_part:
    description: One LEGO part by number (name, image, Rebrickable page) via Rebrickable.
    upstream: "https://rebrickable.com/api/v3/lego/parts/{part_num}/"
    upstream_auth: {secret: REBRICKABLE_API_KEY, header: Authorization, prefix: "key "}
    params:
      part_num: {type: string, pattern: "^[0-9A-Za-z]{1,20}$", default: "3001"}
    cache_ttl_s: 604800
    min_client_refresh_s: 604800
    limits:
      per_ip_per_min: 10
      upstream_per_min: 20
    content_type: application/json
    access: {tier: public, scope: "data:rebrickable_part:read"}
    consumers: [brick_build_3d]
