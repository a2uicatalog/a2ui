# The A2UI Catalog brand -- the SINGLE source for the site's visual tokens.
#
# scripts/gen_brand.py stamps this into scripts/_brand_generated.py (imported by
# generate_atom_pages.py -> SITE_BASE_CSS + the header logo, and by gen_trust_pages.py) and mirrors
# the token table into ../a2ui-private/spec/brand.md when that sibling is present. Never edit the
# outputs by hand; tests/test_brand.py regenerates and compares, and every page carrying the site
# header must carry the CURRENT `/*brand-tokens:<hash>*/` marker (a stale or hand-forked copy fails).
#
# light = the default theme; dark = overrides applied under :root[data-theme="dark"]; aliases are
# theme-independent names for other tokens. Values are CSS; oklch throughout so hue shifts stay
# perceptually even (indigo = hue 277, teal accent-2 = hue 202).
name: A2UI Catalog
wordmark:
  accent: A2UI
  rest: ' Catalog'
font_stack: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif
mono_stack: ui-monospace,'SF Mono',Monaco,monospace
light:
  bg: oklch(98% 0.006 255)
  surface: oklch(100% 0 0)
  surface-2: oklch(96.5% 0.008 255)
  border: oklch(90% 0.01 255)
  border-strong: oklch(82% 0.02 255)
  text: oklch(22% 0.02 255)
  text-muted: oklch(46% 0.02 255)
  accent: oklch(58% 0.19 277)
  accent-contrast: oklch(100% 0 0)
  accent-soft-bg: oklch(94% 0.03 277)
  accent-2: oklch(62% 0.13 202)
  positive: oklch(58% 0.15 146)
  negative: oklch(55% 0.18 25)
  warn: oklch(70% 0.15 87)
  code-bg: oklch(96% 0.01 255)
  radius: 12px
  shadow: 0 1px 2px oklch(0% 0 0 / .05),0 8px 24px oklch(0% 0 0 / .05)
  glow: 0 4px 24px oklch(58% 0.19 277 / .14)
  header-glass: oklch(100% 0 0 / .72)
  grad: linear-gradient(120deg,oklch(58% 0.19 277),oklch(70% 0.14 202))
dark:
  bg: oklch(27% 0.025 255)
  surface: oklch(33% 0.025 255)
  surface-2: oklch(30% 0.02 255)
  border: oklch(42% 0.02 255)
  border-strong: oklch(50% 0.02 255)
  text: oklch(95% 0.01 255)
  text-muted: oklch(72% 0.02 255)
  accent: oklch(72% 0.16 277)
  accent-contrast: oklch(15% 0.02 255)
  accent-soft-bg: oklch(38% 0.06 277)
  accent-2: oklch(75% 0.12 202)
  positive: oklch(72% 0.15 146)
  negative: oklch(68% 0.17 25)
  warn: oklch(85% 0.17 87)
  code-bg: oklch(23% 0.02 255)
  shadow: 0 1px 2px oklch(0% 0 0 / .3),0 8px 24px oklch(0% 0 0 / .28)
  glow: 0 4px 28px oklch(72% 0.16 277 / .22)
  header-glass: oklch(33% 0.025 255 / .72)
  grad: linear-gradient(120deg,oklch(72% 0.16 277),oklch(80% 0.13 202))
aliases:
  card: var(--surface)
  muted: var(--text-muted)
  cyan: var(--accent-2)
  green: var(--positive)
logo:
  viewBox: 0 0 24 24
  elements:
  - tag: ellipse
    class: o1
    cx: 12
    cy: 12
    rx: 10
    ry: 4.4
    transform: rotate(-32 12 12)
  - tag: ellipse
    class: o2
    cx: 12
    cy: 12
    rx: 10
    ry: 4.4
    transform: rotate(32 12 12)
  - tag: ellipse
    class: o3
    cx: 12
    cy: 12
    rx: 10
    ry: 4.4
    transform: rotate(90 12 12)
  - tag: circle
    class: nuc
    cx: 12
    cy: 12
    r: 2.7
  - tag: circle
    class: el
    cx: 3.21
    cy: 15.98
    r: 1.25
