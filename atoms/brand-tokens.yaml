# The A2UI Catalog brand -- the SINGLE source for the site's visual tokens.
#
# scripts/gen_brand.py stamps this into scripts/_brand_generated.py (imported by
# generate_atom_pages.py -> SITE_BASE_CSS + the header logo, and by gen_trust_pages.py) and mirrors
# the token table into ../a2ui-private/spec/brand.md when that sibling is present. Never edit the
# outputs by hand; tests/test_brand.py regenerates and compares, and every page carrying the site
# header must carry the CURRENT `/*brand-tokens:<hash>*/` marker (a stale or hand-forked copy fails).
#
# light = the default theme; dark = overrides applied under :root[data-theme="dark"]; aliases are
# theme-independent names for other tokens. Values are CSS; oklch throughout so hue shifts stay
# perceptually even (indigo = hue 277, teal accent-2 = hue 202).
# 2026-10-13 contrast pass (WCAG AA 4.5:1 for text, from the accessibility scan): accent 58% -> 51% lightness (links, chips, buttons on the page
# background and grey panels); accent-2 stays for graphics and fills (3:1 is enough) and accent-2-text is the deeper teal for TEXT; dark soft tint
# 38% -> 33% so the accent passes on chips.
name: A2UI Catalog
wordmark:
  accent: A2UI
  rest: ' Catalog'
font_stack: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif
mono_stack: ui-monospace,'SF Mono',Monaco,monospace
light:
  bg: '#f6f9fd'
  surface: '#ffffff'
  surface-2: '#eef2f8'
  border: '#dadee5'
  border-strong: '#c3c9d3'
  text: '#141b24'
  text-2: '#2c343f'
  text-muted: '#515963'
  accent: '#5051cf'
  accent-text: '#3a3bb0'
  accent-contrast: '#ffffff'
  accent-soft-bg: '#e6eaff'
  accent-2: '#009ca7'
  accent-2-text: '#007581'
  focus: '#5051cf'
  positive: '#2f913e'
  negative: '#c53637'
  warn: '#c69600'
  code-bg: '#f1f4f9'
  radius: 12px
  shadow: 0 1px 2px rgba(20,27,36,.05),0 10px 30px rgba(20,27,36,.07)
  glow: 0 4px 24px rgba(80,81,207,.16)
  header-glass: rgba(255,255,255,.78)
  grad: linear-gradient(120deg,#6267e7,#00b7c3)
dark:
  bg: '#1e2733'
  surface: '#2d3642'
  surface-2: '#1a222d'
  border: '#4a5361'
  border-strong: '#6b7684'
  text: '#eaeff5'
  text-2: '#d5dbe3'
  text-muted: '#a9b2be'
  accent: '#8d98ff'
  accent-text: '#c7cdff'
  accent-contrast: '#141b24'
  accent-soft-bg: '#2f3463'
  accent-2: '#2ac4ce'
  accent-2-text: '#2ac4ce'
  focus: '#8d98ff'
  positive: '#5cc46c'
  negative: '#ff7d7e'
  warn: '#e6b800'
  code-bg: '#1a222d'
  shadow: 0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28)
  glow: 0 4px 28px rgba(141,152,255,.24)
  header-glass: rgba(45,54,66,.78)
  grad: linear-gradient(120deg,#8d98ff,#2ac4ce)
aliases:
  card: var(--surface)
  muted: var(--text-muted)
  cyan: var(--accent-2)
  green: var(--positive)
  accent-soft: var(--accent-soft-bg)
logo:
  viewBox: 0 0 24 24
  elements:
  - tag: ellipse
    class: o1
    cx: 12
    cy: 12
    rx: 10
    ry: 4.4
    transform: rotate(-32 12 12)
  - tag: ellipse
    class: o2
    cx: 12
    cy: 12
    rx: 10
    ry: 4.4
    transform: rotate(32 12 12)
  - tag: ellipse
    class: o3
    cx: 12
    cy: 12
    rx: 10
    ry: 4.4
    transform: rotate(90 12 12)
  - tag: circle
    class: nuc
    cx: 12
    cy: 12
    r: 2.7
  - tag: circle
    class: el
    cx: 3.21
    cy: 15.98
    r: 1.25
