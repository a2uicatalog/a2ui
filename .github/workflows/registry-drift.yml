name: Registry listing drift
# Weekly, read-only: compares the Smithery listing (name, description, tool count) with the live MCP server.
# No secrets. A failing run means the hand-entered listing needs a dashboard edit or a republish; the log says which.
on:
  schedule:
    - cron: '0 7 * * 1'      # Mondays 07:00 UTC
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: python3 scripts/check_registry_listings.py
