name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}          # manual "Run workflow" button — no path filter
                                   # to add a re-trigger commit around, unlike
                                   # the private repo's per-worker deploys
# Same guard added to a2ui-private's deploy-mcp-worker.yml (2026-07-14 incident)
# and deploy-blog-worker.yml: two pushes close together queue two runs with no
# ordering guarantee, and whichever finishes LAST wins regardless of which
# commit was newer. A newer push cancels whatever's still running instead.
#
# If this workflow fails with a generic step error and no clear cause, check
# https://www.cloudflarestatus.com/ before re-diagnosing repo-side (2026-07-31:
# Cloudflare's control-plane API was down/unresponsive for ~40min while their
# CDN/edge stayed fully healthy — the live site kept serving traffic the whole
# time, so nothing was visible from curling the site itself; only wrangler
# whoami / a raw call to api.cloudflare.com revealed it).
concurrency:
  group: deploy-catalogue-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — gen_sitemap.py's git_lastmod_map() reads full commit
      # history to build <lastmod> dates (2026-08-16). The default shallow
      # checkout (fetch-depth: 1) would give `git log` only the tip commit,
      # so the sitemap would silently ship with almost no lastmod coverage
      # in CI despite working perfectly in a local full clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Kept in step with requirements.txt by hand (this workflow doesn't
        # read that file) -- see requirements.txt's own 2026-08-24 comment
        # on jsonschema for why that matters.
        run: pip install pyyaml markdown pytest jsonschema regex defusedxml

      - name: Build atom pages
        run: python3 scripts/generate_atom_pages.py

      - name: Build machine-readable catalog (spec.json, compact index, runbooks)
        run: python3 scripts/gen_public_catalog.py

      - name: Build strict per-atom JSON Schema (LLM response_format constraints)
        run: python3 scripts/gen_atom_json_schemas.py

      - name: Compile knowledge atoms (opt-in, unannounced tier)
        run: python3 scripts/gen_knowledge.py

      - name: Dereference discovery document URLs against build output
        run: python3 scripts/check_catalog_links.py

      - name: Build OpenAPI spec + llms.txt (counts from spec.json)
        run: python3 scripts/gen_openapi.py

      - name: Build trust pages + agents.md
        run: python3 scripts/gen_trust_pages.py

      - name: Build sitemap.xml from real build output
        run: python3 scripts/gen_sitemap.py

      - name: Enforce project.yaml (visibility policy + declared debt)
        run: python3 -m pytest tests/test_project_manifest.py -q

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4.0.0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
