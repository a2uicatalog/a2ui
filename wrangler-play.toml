name = "a2uicatalog-play"
account_id = "874e86ca2e6319749c576074fcc72b97"
compatibility_date = "2024-09-23"

# This origin exists ONLY to isolate cross-origin embeds (see
# gen_mcp_apps_bundle.py's own comment on why the mcp-apps renderer bundle
# needs a genuinely separate origin, not just a stricter sandbox attribute
# — #mcp-view's allow-same-origin is only safe because THIS hostname's
# cookies/DOM are worthless to steal). That guarantee holds only as long as
# this origin stays permanently stateless: no auth, no login, no saved
# state, ever. If a future feature needs real state on this bundle, it
# needs a DIFFERENT hostname, not this one.
#
# Same reasoning as wrangler-full.toml's own workers_dev/preview_urls
# comment: no alternate unlisted origin should ever serve this content —
# keeps the deployed surface to exactly the one documented hostname.
workers_dev = false
preview_urls = false

# Tried declaring the custom domain here (`routes = [{ pattern =
# "play.a2uicatalog.ai", custom_domain = true }]`, letting `wrangler
# deploy` provision it — including the DNS record — with no dashboard
# step). Reverted 2026-09-10: it broke every deploy to main with
# "Authentication error [code: 10000]" on /zones/.../workers/routes,
# twice, even after CF_API_TOKEN was given Zone > All zones > Routes >
# Edit — so either that's not the exact permission group this API call
# needs, or the token edit hadn't propagated. Not worth blocking the
# whole deploy pipeline on while that gets sorted separately. The
# custom domain is bound by hand in the Cloudflare dashboard instead,
# same mechanism already used for full.a2uicatalog.ai. If CF_API_TOKEN
# ever does get the right scope confirmed, the routes block above is a
# safe thing to re-add — it's what was tried and it might just need
# retrying.

[assets]
directory = "./public-play"
